name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Two runners, deliberately: node --test runs the framework-free core in src/ with no
      # toolchain, vitest runs the React components in app/. See CLAUDE.md — merging them would
      # put the tested scoring core behind a transform, which the port was careful not to do.
      - name: Unit tests (src/)
        run: node --test

      - name: Component tests (app/)
        run: npm run test:ui

      # The port deleted patchScores() and its data-*-hook assertions. These component tests are
      # what replaced them: they simulate a real interaction and assert the rendered score changes.
      - name: Build
        run: npx next build

      # Characterization gate: whole-player totals across the risky board states.
      # A failure here means a scoring rule changed. If that was deliberate, regenerate
      # scripts/score-fixtures.expected.json in the same commit and say so in the message.
      - name: Scoring fixtures
        run: node scripts/score-fixtures.mjs --check
