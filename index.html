<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Faithful Tally</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<img class="corner-critter fennec" src="assets/animal-fennec.png" alt="" aria-hidden="true">
<img class="corner-critter bird" src="assets/animal-bird.png" alt="" aria-hidden="true">

<div class="page-inner">

<div class="logo-wrap" id="logoWrap">
  <button id="mastheadHome" class="masthead-home" title="Switch game" aria-label="Switch game — back to the game picker">
    <img id="masthead" src="assets/logo.png" alt="Harmonies">
  </button>
</div>

<div class="view active" id="view-picker">
  <div class="site-name">The Faithful Tally</div>
  <div class="subtitle">Which game are we tallying?</div>
  <div class="picker-grid" id="pickerGrid"></div>
</div>

<div class="view" id="view-landing">
  <div class="subtitle">Who's tallying tonight?</div>
  <div class="landing-card">
    <div class="landing-row">
      <input type="text" id="landingName" placeholder="Your name" autocomplete="off">
      <button id="landingContinue" class="btn-primary" disabled>Continue</button>
    </div>
    <div id="landingChips" class="chip-row"></div>
    <div class="landing-hint">
      <button id="landingSkip" class="link-btn">Just tally a game →</button>
      <button id="landingLeaderboard" class="link-btn">🏆 Leaderboard</button>
      <button id="switchGame" class="link-btn">🎲 Switch game</button>
    </div>
  </div>
</div>

<div class="view" id="view-scorer">
  <div class="top-links">
    <button id="switchPlayer" class="link-btn">🏠 Switch player</button>
    <button id="scorerLeaderboard" class="link-btn">🏆 Leaderboard</button>
  </div>
  <div class="subtitle" id="scorerSubtitle">End-of-game tally</div>

  <div class="global-settings" id="globalSettings">
    <div class="toggle-group" id="modeToggle">
      <button data-mode="player" class="active">Player</button>
      <button data-mode="category">Category</button>
    </div>
    <div class="toggle-group" id="waterToggle">
      <button data-side="river" class="active">River</button>
      <button data-side="island">Islands</button>
    </div>
    <button class="rules-toggle active" id="rulesToggle" aria-pressed="true"
            title="Show scoring explanations" aria-label="Show scoring explanations">?</button>
  </div>

  <div id="saveBanner" class="save-banner"></div>

  <div class="players" id="players"></div>
</div>

<div class="view" id="view-history">
  <div class="top-links">
    <button id="historyBack" class="link-btn">← Back</button>
    <span></span>
  </div>
  <div class="history-card">
    <div class="history-title" id="historyName"></div>
    <div class="history-highscore" id="historyHighScore"></div>
    <div id="historyList"></div>
  </div>
</div>

<div class="view" id="view-leaderboard">
  <div class="top-links">
    <button id="leaderboardBack" class="link-btn">← Back</button>
    <span></span>
  </div>
  <div class="history-card">
    <div class="history-title">🏆 Leaderboard</div>
    <div id="leaderboardList"></div>
  </div>
</div>

<div class="citation-footer">
  Benvenuto, J. (2024). Harmonies [Board game]. Libellud.<br>
  Goupy, J., &amp; Lebrat, C. (2023). Faraway [Board game]. Catch Up Games.<br>
  Bauza, A. (2010). 7 Wonders [Board game]. Repos Production.
</div>

</div><!-- /.page-inner -->

<div class="footer-bar" id="footerBar">
  <button id="addPlayer">+ Add player</button>
  <button id="saveGame" class="btn-primary">Save this game</button>
  <button id="newGame">New game</button>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
