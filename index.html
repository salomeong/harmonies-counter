<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Faithful Tally</title>
<link rel="icon" href="assets/logo.png">
<style>
  :root{
    --bg: #eee2c6;
    --card: #fbf6e9;
    --ink: #2f3b2f;
    --muted: #6b7a6b;
    --line: #ddd0ab;
    --green: #4f8f6d;
    --green-dark: #2d6e5e;
    --blue: #3f7ea6;
    --tan: #b98a4a;
    --gray: #8a8578;
    --red: #b0524a;
    --yellow: #d1a239;
    --accent: #e0871f;
    --winner: #fbead0;
    --accent-text: var(--green-dark);

    /* real Harmonies token colors, from the rulebook component key */
    --tok-water: #4a92ad;
    --tok-mountain: #9a9690;
    --tok-brown: #96603c;
    --tok-tree: #8a9a3f;
    --tok-field: #e8b93a;
    --tok-building: #c1483f;

    /* side walls of the drawn tokens — each hue darkened ~20% */
    --tok-water-d: #35708a;
    --tok-mountain-d: #78746e;
    --tok-brown-d: #74482c;
    --tok-tree-d: #69762f;
    --tok-field-d: #bf9320;
    --tok-building-d: #98352d;

    /* the cream hex recess a token sits in */
    --tok-slot: #e4d2a6;

    /* 7 Wonders card colours, at the saturation the real cards have. Players say "the red card"
       and "the purple card", so the button has to actually be that colour — muting these into the
       parchment palette would make the game harder to score, not more tasteful. */
    --sw-brown:  #8a5a34;
    --sw-blue:   #2f6fa8;
    --sw-green:  #3f8f5c;
    --sw-yellow: #e0a92a;
    --sw-red:    #b8402f;
    --sw-purple: #6b4c9a;

    /* extruded edges — each hue darkened ~22%, same rule as --tok-*-d */
    --sw-brown-d:  #6b4526;
    --sw-blue-d:   #235483;
    --sw-green-d:  #2f6f46;
    --sw-yellow-d: #b8871d;
    --sw-red-d:    #91301f;
    --sw-purple-d: #523874;

    /* struck components. --sw-gold is sampled from the printed logo (#f0c000, the dominant
       saturated hue across the wordmark) rather than guessed. */
    --sw-gold:    #f0c000;
    --sw-gold-d:  #b58c00;
    --sw-war:     #b03a2c;
    --sw-war-d:   #862a1f;
    --sw-defeat:  #4e4a46;
    --sw-defeat-d:#38352f;

    /* ink dark enough to sit on gold: #2b2113 on --sw-gold measures 9.2:1 */
    --sw-ink: #2b2113;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: #1b211a;
      --card: #262c23;
      --ink: #ece6d6;
      --muted: #a3ad98;
      --line: #3c4436;
      --winner: #40371f;
      --accent-text: #7fd9ab;
      --tok-slot: #3f4735;
    }
  }
  :root[data-theme="dark"]{
    --bg: #1b211a; --card: #262c23; --ink: #ece6d6; --muted: #a3ad98; --line: #3c4436; --winner: #40371f;
    --accent-text: #7fd9ab;
    --tok-slot: #3f4735;
  }
  :root[data-theme="light"]{
    --bg: #eee2c6; --card: #fbf6e9; --ink: #2f3b2f; --muted: #6b7a6b; --line: #ddd0ab; --winner: #fbead0;
    --tok-slot: #e4d2a6;
  }
  *{ box-sizing: border-box; }
  html, body{
    max-width: 100vw;
    overflow-x: hidden;
  }
  body{
    margin: 0;
    font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      linear-gradient(rgba(255,251,240,0.55), rgba(255,251,240,0.55)),
      var(--bg) url("assets/parchment-bg.jpg") center / cover fixed no-repeat;
    color: var(--ink);
    padding: 16px;
    padding-bottom: 100px;
    position: relative;
    min-height: 100vh;
  }
  @media (prefers-color-scheme: dark){
    body{
      background:
        linear-gradient(rgba(10,14,9,0.78), rgba(10,14,9,0.78)),
        var(--bg) url("assets/parchment-bg.jpg") center / cover fixed no-repeat;
    }
  }
  :root[data-theme="dark"] body{
    background:
      linear-gradient(rgba(10,14,9,0.78), rgba(10,14,9,0.78)),
      var(--bg) url("assets/parchment-bg.jpg") center / cover fixed no-repeat;
  }
  :root[data-theme="light"] body{
    background:
      linear-gradient(rgba(255,251,240,0.55), rgba(255,251,240,0.55)),
      var(--bg) url("assets/parchment-bg.jpg") center / cover fixed no-repeat;
  }
  .corner-critter{
    position: fixed;
    width: 130px;
    opacity: 0.9;
    pointer-events: none;
    z-index: 0;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.15));
  }
  .corner-critter.fennec{
    left: -18px;
    bottom: -10px;
    width: 150px;
    transform: scaleX(-1);
  }
  .corner-critter.bird{
    right: -10px;
    top: 6px;
    width: 100px;
  }
  @media (max-width: 700px){
    .corner-critter{ display: none; }
  }
  .page-inner{
    position: relative;
    z-index: 1;
  }
  .logo-wrap{
    display: flex;
    justify-content: center;
    margin-bottom: 2px;
  }
  .logo-wrap.hidden{ display: none; }
  .logo-wrap img{
    width: min(70vw, 300px);
    height: auto;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.12));
  }
  @media (prefers-color-scheme: dark){
    .logo-wrap img{ filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4)) brightness(1.15); }
  }
  :root[data-theme="dark"] .logo-wrap img{
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4)) brightness(1.15);
  }
  :root[data-theme="light"] .logo-wrap img{
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.12));
  }
  h1{
    font-size: 1.4rem;
    margin: 4px 0 2px;
    text-align: center;
  }
  .site-name{
    text-align: center;
    font-size: 1.5rem;
    letter-spacing: 0.06em;
    color: var(--ink);
    margin: 4px 0 2px;
  }
  .subtitle{
    text-align: center;
    color: var(--accent-text);
    font-size: 0.85rem;
    font-style: italic;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .global-settings{
    max-width: 640px;
    margin: 0 auto 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 10px;
    display: flex;
    /* wrap is the last resort: on a 320px screen a second row beats silently clipping
       "Category" and "Islands" against .toggle-group's overflow:hidden */
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .toggle-group{
    display: flex;
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .toggle-group button{
    border: none;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    padding: 7px 10px;
    font-size: 0.79rem;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
  }
  .toggle-group button.active{
    background: var(--tok-water);
    color: white;
  }
  .players{
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .player-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 14px 14px;
    position: relative;
    box-shadow: 0 2px 10px rgba(60,45,20,0.06);
    overflow: hidden;
  }
  .player-card::before{
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg,
      var(--tok-water) 0 20%,
      var(--tok-field) 20% 40%,
      var(--tok-tree) 40% 60%,
      var(--tok-mountain) 60% 80%,
      var(--tok-building) 80% 100%);
  }
  .player-card.winner{
    background: var(--winner);
    border-color: var(--accent);
    box-shadow: 0 4px 18px rgba(224,135,31,0.25);
  }
  .player-header{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .mascot{
    width: 38px;
    height: 38px;
    border-radius: 50%;
    object-fit: cover;
    object-position: center 20%;
    background: var(--bg);
    border: 2px solid var(--line);
    flex-shrink: 0;
  }
  .player-card.winner .mascot{
    border-color: var(--accent);
  }
  .player-header input[type="text"]{
    flex: 1;
    min-width: 0;
    font-size: 1.05rem;
    font-weight: 600;
    border: none;
    background: transparent;
    color: var(--ink);
    padding: 4px 2px;
    border-bottom: 1px solid transparent;
  }
  .player-header input[type="text"]:focus{
    outline: none;
    border-bottom: 1px solid var(--line);
  }
  .remove-player{
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 1.1rem;
    cursor: pointer;
    padding: 2px 6px;
  }
  /* ---- points vs counts ----
     On the physical components every point value sits inside a coloured bubble and nothing else
     does. Borrowing that rule outright: a number in a blob is ALWAYS points, a bare numeral is
     ALWAYS a count. That is what separates the "7" a token is worth from the "×3" you have. */
  /* One colour for every point value. Tying each pip to its token colour looked tempting, but
     white on --tok-field measures 1.84:1 and on --tok-tree 3.10:1 — both fail AA at this size.
     A single ink also makes the "blob = points" rule read harder. */
  .pip{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--pip, var(--green-dark));
    color: var(--pip-ink, #fff);
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    line-height: 1;
    font-size: 0.72rem;
    letter-spacing: 0.01em;
    min-width: 1.9em;
    padding: 3px 6px;
    /* irregular, like the printed blobs on the component key rather than a UI chip */
    border-radius: 46% 54% 52% 48% / 54% 46% 54% 46%;
    text-shadow: 0 1px 1px rgba(0,0,0,0.28);
    box-shadow: inset 0 -1px 2px rgba(0,0,0,0.22), inset 0 1px 1px rgba(255,255,255,0.28);
  }
  .pip-score{
    font-size: 0.86rem;
    padding: 5px 9px;
    min-width: 2.2em;
  }
  /* white on --accent is only 2.74:1, so the grand total carries dark ink instead — 5.84:1 */
  .pip-total{
    --pip: var(--accent);
    color: #1b2416;
    text-shadow: none;
    font-size: 1.05rem;
    padding: 6px 11px;
    min-width: 2.4em;
  }
  .pip-sub{
    --pip: transparent;
    color: var(--ink);
    font-weight: 700;
    text-shadow: none;
    box-shadow: none;
    border: 1.5px solid var(--line);
    padding: 2px 6px;
  }
  .total-badge{ flex-shrink: 0; }

  /* Counts are what you are actively changing, so they get the weight — but never a blob. */
  .count-pre{
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--muted);
    margin-right: 1px;
  }
  .count-num{
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .category{
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 6px 10px;
    padding: 8px 0;
    border-top: 1px solid var(--line);
  }
  .category:first-of-type{ border-top: none; }
  .cat-label{
    font-size: 0.88rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .tok-dot{
    display: inline-block;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    box-shadow: inset 0 -2px 2px rgba(0,0,0,0.25), inset 0 1px 1px rgba(255,255,255,0.4);
    flex-shrink: 0;
  }
  .cat-hint{
    font-size: 0.74rem;
    color: var(--muted);
    grid-column: 1 / -1;
    margin-top: -2px;
  }
  .subrow{
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .num-input{
    width: 3.2em;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    border-radius: 8px;
    padding: 4px 4px;
    font-size: 0.95rem;
    text-align: center;
  }
  .animal-list{
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .animal-row{
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .animal-row input[type="number"]{
    width: 4em;
  }
  .animal-row button{
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 1rem;
    cursor: pointer;
  }
  .add-btn{
    align-self: flex-start;
    border: 1px dashed var(--line);
    background: transparent;
    color: var(--accent-text);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 0.8rem;
    cursor: pointer;
    margin-top: 2px;
  }

  /* ---- tally rows ---- */
  .tally-group{
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .tally{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .tally-btn{
    width: 68px;
    min-height: 56px;
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 12px;
    padding: 4px 2px 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    cursor: pointer;
    /* the row is tapped fast and repeatedly — never let a tap select text or fire a zoom */
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: manipulation;
    transition: transform 0.06s ease, background 0.12s ease;
  }
  .tally-btn:active{
    transform: scale(0.94);
    background: var(--winner);
  }
  .tok-art{
    width: 40px;
    height: 40px;
    display: block;
    pointer-events: none;
  }
  .tok-slot{ fill: var(--tok-slot); }
  .tally-btn .pip{ pointer-events: none; }
  .tally-cap{
    font-size: 0.66rem;
    font-weight: 600;
    color: var(--muted);
    line-height: 1;
    pointer-events: none;
  }
  .tally-count{
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .count-chip{
    border: none;
    background: transparent;
    font-family: inherit;
    display: inline-flex;
    align-items: baseline;
    padding: 6px 4px;
    min-width: 2.6em;
    min-height: 32px;
    justify-content: flex-end;
    cursor: pointer;
    border-bottom: 1px dashed var(--line);
    position: relative;
  }
  .count-input{
    width: 3.2em;
    border: 1px solid var(--accent);
    background: var(--card);
    color: var(--ink);
    border-radius: 6px;
    padding: 1px 4px;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    text-align: center;
  }
  .minus{
    width: 32px;
    height: 32px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    border-radius: 50%;
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
    position: relative;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  /* Stretch the touch target to 44px vertically without growing the layout. Only vertically —
     these sit shoulder to shoulder, so a horizontal expander would steal its neighbour's taps. */
  .count-chip::after,
  .minus::after{
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 44px;
    transform: translateY(-50%);
  }
  /* kept in the layout at 0 rather than hidden — a control that appears on first tap
     reflows the row under a moving finger */
  .minus:disabled{
    opacity: 0.3;
    cursor: default;
  }

  /* shared with the Faraway scorer, which still uses the plain label/score grid */
  .cat-pts{
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--accent-text);
    text-align: right;
  }

  /* ---- accordion category (Harmonies) ---- */
  .category.acc{
    display: block;
    padding: 0;
  }
  .cat-head{
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    border: none;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 600;
    text-align: left;
    padding: 11px 2px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .cat-name{ flex: 1; min-width: 0; }
  .card-tools{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 2px 0 10px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 2px;
  }
  .mini-btn.danger{
    color: var(--red);
    border-color: color-mix(in srgb, var(--red) 40%, transparent);
  }
  .rules-toggle{
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 800;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .rules-toggle.active{
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  /* Shrink the settings controls before letting them wrap, so one row survives down to the
     narrowest common phones. Must come after the base .toggle-group button rule to win. */
  @media (max-width: 372px){
    .global-settings{ padding: 7px 7px; gap: 3px; }
    .toggle-group button{ padding: 7px 6px; font-size: 0.72rem; }
    .rules-toggle{ width: 26px; height: 26px; font-size: 0.82rem; }
  }
  .chev{
    color: var(--muted);
    font-size: 0.9rem;
    width: 1em;
    text-align: center;
  }
  .cat-body{
    padding: 0 2px 8px;
  }
  .cat-actions{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }
  .mini-btn{
    border: 1px solid var(--line);
    background: transparent;
    color: var(--accent-text);
    font-family: inherit;
    font-size: 0.76rem;
    font-weight: 600;
    border-radius: 999px;
    padding: 7px 12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .category.acc .cat-hint{
    margin: 0 2px 10px;
  }
  .total-edit{
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .total-input{
    width: 4em;
    border: 1px solid var(--accent);
    background: var(--card);
    color: var(--ink);
    border-radius: 8px;
    padding: 5px 6px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    text-align: center;
  }
  .revert-btn{
    width: 30px;
    height: 30px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    border-radius: 50%;
    font-size: 0.95rem;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }

  /* ---- river ladder ---- */
  .ladder{
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 2px;
  }
  /* Ladder rungs are point values, so they take the blob shape like every other point on screen */
  .rung{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    background: color-mix(in srgb, var(--rung, var(--tok-water)) 18%, transparent);
    border-radius: 46% 54% 52% 48% / 54% 46% 54% 46%;
    padding: 4px 7px;
    min-width: 2.2em;
    transition: transform 0.12s ease;
  }
  /* dark ink on the water blue: 4.58:1, where white would only manage 3.50:1.
     --rung lets a game supply its own ladder hue. Whoever uses it next: measure the pairing, don't
     assume this ink carries over. --sw-green with this same ink is only 4.04:1, which fails AA at
     the rung's 11.5px — that mistake was caught in review here rather than in the wild. */
  .rung.on{
    background: var(--rung, var(--tok-water));
    color: #1b2416;
    transform: scale(1.14);
    box-shadow: inset 0 -1px 2px rgba(0,0,0,0.18), inset 0 1px 1px rgba(255,255,255,0.3);
  }

  /* 7 Wonders wears its own colours inside the scorer. The grand total deliberately stays
     --accent in every game, so "the big orange blob is the final score" holds everywhere; what
     changes here is the category and token pips, which take the wordmark's gold (#f0c000 sampled
     from the printed logo) with --sw-ink over it at 9.2:1. */
  #view-scorer[data-game="7wonders"]{
    --pip: var(--sw-gold);
    --pip-ink: var(--sw-ink);
    /* deliberately no --rung: 7 Wonders draws no ladder. Science has three independent symbol
       counts, which a single rung strip can't represent, so it explains itself with .cat-work
       instead. */
  }

  /* "Show your working" — the line under a category that explains how its number was reached.
     Science is the whole reason this exists: 3 tablets / 2 compasses / 1 gear scoring 21 is the
     most-miscounted rule in the game, and seeing 9 + 4 + 1 and "1 set x 7" is what makes the
     result trustworthy rather than magic. Set in the same dashed-underline pencil idiom as the
     tally counts, because it is working-out, not a result. */
  .cat-work{
    grid-column: 1 / -1;
    display: flex;

<script type="module">
import { GAMES, GAME_LIST, getGame } from "./src/games/index.js";
import { makeScorer, numOf } from "./src/scoring.js";
import {
  tokenArt, getCount, setCount, bumpCount, escapeAttr
} from "./src/ui/controls.js";
import { catBody, playerCardBody } from "./src/ui/card.js";

// The active game declaration and the scorer bound to it (src/scoring.js's makeScorer). Every
// score, label, hint, icon and control below is read through `scorer` — see CLAUDE.md's
// scoring-model section for why nothing may read a category score any other way.
let game = null;
let scorer = null;
// `activeGame` is a plain string mirror of `game.key`, kept because the /api/* calls send it
// verbatim (?game=harmonies / ?game=faraway) — changing that string would orphan already-saved
// data, so it stays exactly as it was even though `game.key` now carries the same information.
let activeGame = null;

// `waterSide` lives in per-game state (below) rather than as its own bare global, same reasoning
// as players/activeCat/etc: a second game with its own River/Islands-shaped variant couldn't
// otherwise avoid colliding with Harmonies' toggle. This local mirror is what `variant()` reads;
// selectGame()/syncGameState() keep it in sync with `gameState` exactly like scoreMode.
let waterSide = "river";
const variant = () => ({ waterSide });

// Players (plus category-mode state: activeCat/doneCats/scoreMode/waterSide) are kept per-game,
// so switching games and back doesn't just preserve scores — it puts you back exactly where you
// left that game, same as the old app never tearing down Harmonies' one persistent session in
// the first place (switching to Faraway and back used to be free precisely because Harmonies'
// state was never touched by leaving it).
const gameState = new Map(); // game key -> { players, nextId, activeCat, doneCats, scoreMode, waterSide }
let players = [];
let nextId = 1;

function ensureGameState(key){
  if (!gameState.has(key)){
    const g = getGame(key);
    const sc = makeScorer(g, variant);
    gameState.set(key, {
      players: [sc.newPlayer(1, "Player 1"), sc.newPlayer(2, "Player 2")],
      nextId: 3,
      activeCat: g.cats.length ? g.cats[0].key : null,
      doneCats: new Set(),
      scoreMode: "player",
      waterSide: "river"
    });
  }
  return gameState.get(key);
}

// `players`/`nextId`/etc. are local mirrors of the active game's slot in `gameState` (for every
// other function below to read/write without threading `game.key` through every call).
// Reassignments — "New game", removing a player, picking a tab, toggling mode — replace the
// value rather than mutating in place, so the mirror has to be written back explicitly; render()
// does that on every call, which covers every path that changes them (in-place mutation, e.g. a
// tally tap or doneCats.add(), needs no sync since it's the same object already stored in the map).
function syncGameState(){
  if (game) gameState.set(game.key, { players, nextId, activeCat, doneCats, scoreMode, waterSide });
}

function selectGame(key){
  const g = getGame(key);
  if (!g) return;
  game = g;
  activeGame = g.key;
  scorer = makeScorer(g, variant);
  const st = ensureGameState(key);
  players = st.players;
  nextId = st.nextId;
  activeCat = st.activeCat;
  doneCats = st.doneCats;
  scoreMode = st.scoreMode;
  waterSide = st.waterSide;

  const showSettingsBar = !!(g.categoryMode || g.waterToggle);
  document.getElementById("globalSettings").style.display = showSettingsBar ? "" : "none";
  document.getElementById("modeToggle").style.display = g.categoryMode ? "" : "none";
  document.getElementById("waterToggle").style.display = g.waterToggle ? "" : "none";
  document.querySelectorAll("#modeToggle button").forEach(b => b.classList.toggle("active", b.dataset.mode === scoreMode));
  document.querySelectorAll("#waterToggle button").forEach(b => b.classList.toggle("active", b.dataset.side === waterSide));

  render();
}

// "player" walks one player down all categories; "category" scores one category across everyone.
// Category mode only exists for games with `categoryMode: true` — render() guards the branch so a
// game without it (Faraway) can never get stuck showing tabs it has no toggle to leave.
let scoreMode = "player";
let activeCat = null;
// Which categories the table has finished. Shared across players, because a category is called
// out once for everyone. A category counts as done when it is touched, or when you deliberately
// move past it — a player with no buildings scores a legitimate 0 and would never earn a tick.
let doneCats = new Set();
// Explanations are on for a first-timer and stay off once you know the rules.
let showRules = localStorage.getItem("tally.showRules") !== "0";

const MASCOTS = [
  "assets/animal-fennec.png",
  "assets/animal-rabbit.png",
  "assets/animal-bird.png",
  "assets/animal-boar.png",
  "assets/animal-mouse.png"
];

// Small icon for the by-category tab strip — the same drawn tokens as the tally buttons, so the
// strip reads as the same visual language rather than a separate icon set. A category's `art`
// drives this when present — either a tokenArt() kind for the disc-shaped games, or a function
// returning its own SVG for a game whose components aren't discs (7 Wonders draws cards and struck
// tokens). Without one (bonus/spirit has no drawn token) it falls back to the plain `icon` glyph,
// exactly like the old hardcoded switch's `default` arm did.
function catTabIcon(key){
  const c = scorer.cat(key);
  if (typeof c.art === "function") return c.art();
  return c.art ? tokenArt(c.art, 1) : `<span class="tab-glyph">${scorer.icon(key)}</span>`;
}

// catBody/categoryBlock/playerCardBody/sumStrip (the markup builders these used to be) now live
// in src/ui/card.js as pure functions — see CLAUDE.md's "Every rendered number needs a patch
// hook" section for why that move happened. index.html still owns everything that touches the
// DOM: creating elements, calling render()/patchScores(), and wiring events.

function render(){
  syncGameState();

  const active = document.activeElement;
  let focusUid = null, selStart = null, selEnd = null;
  if (active && active.dataset && active.dataset.uid){
    focusUid = active.dataset.uid;
    if (typeof active.selectionStart === "number"){
      selStart = active.selectionStart;
      selEnd = active.selectionEnd;
    }
  }

  // At the cap the button stays put but reads as inert (see .footer-bar button:disabled). Say why,
  // so it isn't just a control that mysteriously stopped working.
  const addBtn = document.getElementById("addPlayer");
  const atCap = players.length >= (game.maxPlayers || Infinity);
  addBtn.disabled = atCap;
  if (atCap) addBtn.title = `${game.label} seats up to ${game.maxPlayers} players`;
  else addBtn.removeAttribute("title");

  const container = document.getElementById("players");
  container.innerHTML = "";

  if (scoreMode === "category" && game.categoryMode) renderByCategory(container);
  else renderByPlayer(container);

  patchScores();

  // The strip scrolls, so a tab picked from the far end must be brought back into view.
  const tab = container.querySelector(".cat-tab.active");
  if (tab) tab.scrollIntoView({ block: "nearest", inline: "center" });

  if (focusUid){
    const el = container.querySelector(`[data-uid="${focusUid}"]`);
    if (el){
      el.focus();
      if (selStart !== null && el.setSelectionRange){
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
}

function renderByPlayer(container){
  players.forEach((p, idx) => {
    const card = document.createElement("div");
    // `cardClass` is an explicit opt-in (set by Faraway) rather than `!game.accordion` doubling
    // as the trigger — a future flat-layout game with no cardClass gets plain `.player-card`
    // styling instead of silently inheriting Faraway's `.fa` colours.
    card.className = "player-card" + (game.cardClass ? " " + game.cardClass : "");
    card.dataset.pid = p.id;

    card.innerHTML = playerCardBody(game, scorer, p, {
      mascotSrc: MASCOTS[idx % MASCOTS.length],
      // The game's declared minimum, not a hardcoded ">1" — a game whose rules require e.g. 3
      // players (7 Wonders) must not let itself get tallied down to 1.
      showRemove: players.length > game.minPlayers,
      showRules,
      variant: variant()
    });

    container.appendChild(card);
    wireCard(card, p);
  });
}

function renderByCategory(container){
  const tabs = scorer.keys.map(key => {
    return `
      <button class="cat-tab${activeCat === key ? " active" : ""}${doneCats.has(key) ? " done" : ""}"
              data-role="pickCat" data-cat="${key}" aria-label="${escapeAttr(scorer.label(key))}"
              aria-current="${activeCat === key}">
        ${catTabIcon(key)}
        <span class="tick" aria-hidden="true">✓</span>
      </button>`;
  }).join("");

  container.insertAdjacentHTML("beforeend", `
    <div class="cat-tabs" role="tablist">
      ${tabs}
      <button class="cat-tab review${activeCat === "__review" ? " active" : ""}"
              data-role="pickCat" data-cat="__review" aria-label="Review all scores">Σ</button>
    </div>`);

  if (activeCat === "__review"){
    container.insertAdjacentHTML("beforeend", reviewGrid());
    return;
  }

  const page = document.createElement("div");
  page.className = "cat-page";
  page.innerHTML = `
    <div class="cat-page-head">
      <span class="tok-dot" style="background:var(${scorer.dot(activeCat)})"></span>
      <span class="cat-page-name">${scorer.label(activeCat)}</span>
    </div>
    ${showRules ? `<div class="cat-hint">${scorer.hint(activeCat)}</div>` : ""}
  `;
  container.appendChild(page);

  players.forEach((p, idx) => {
    const row = document.createElement("div");
    row.className = "cat-row";
    row.dataset.pid = p.id;
    // The row itself is the `[data-cat]` ancestor patchScores() looks for when it needs to know
    // which descriptor governs a `.ladder` inside it (see patchScores below).
    row.dataset.cat = activeCat;
    row.innerHTML = `
      <div class="row-head">
        ${game.mascots ? `<img class="mascot small" src="${MASCOTS[idx % MASCOTS.length]}" alt="">` : ""}
        <span class="row-name">${escapeAttr(p.name)}</span>
        <span class="pip pip-score" data-pts-for="${activeCat}">0</span>
        <span class="total-badge small">0</span>
      </div>
      ${catBody(scorer, p, activeCat, { variant: variant() })}
    `;
    page.appendChild(row);
    wireCard(row, p);
  });

  const next = nextUndoneCat();
  page.insertAdjacentHTML("beforeend", `
    <div class="cat-page-foot">
      <button class="mini-btn" data-role="nextCat">${next === "__review" ? "Review →" : scorer.label(next) + " →"}</button>
    </div>`);
}

// "Next" walks to the next category still needing attention rather than the next index, so the
// arrow stays useful however much you jumped around with the tabs.
function nextUndoneCat(){
  const keys = scorer.keys;
  const start = keys.indexOf(activeCat);
  for (let i = 1; i <= keys.length; i++){
    const key = keys[(start + i) % keys.length];
    if (!doneCats.has(key) && key !== activeCat) return key;
  }
  return "__review";
}

// The review grid is only ever shown for category-mode games (Harmonies today). Its sub-columns
// are generated from `game.sums`, one per declared group — a game whose groups aren't named
// "landscape"/"animals" used to render a literal "undefined" column here (patchScores() does
// `b[el.dataset.sum]`), and Harmonies' own third group ("spirit") never got a column at all
// because the two sub-columns were hardcoded. Rendering every group is a visible change for
// Harmonies (a third "+ spirit" column now appears) — see CLAUDE.md/the refactor report for why
// that was left as-is rather than truncated.
function reviewGrid(){
  const keys = scorer.keys;
  const sumGroups = game.sums || [];
  return `
    <div class="review-grid-wrap">
      <table class="review-grid">
        <thead>
          <tr>
            <th class="who">Player</th>
            ${keys.map(k => `<th title="${escapeAttr(scorer.label(k))}">${scorer.icon(k)}</th>`).join("")}
            ${sumGroups.map(s => `<th class="sub" title="${escapeAttr(s.label)}">${escapeAttr(s.label)}</th>`).join("")}
            <th class="grand">TOTAL</th>
          </tr>
        </thead>
        <tbody>
          ${players.map(p => `
            <tr data-pid="${p.id}">
              <td class="who">${escapeAttr(p.name)}</td>
              ${keys.map(k => `<td data-pts-for="${k}">0</td>`).join("")}
              ${sumGroups.map(s => `<td class="sub" data-sum="${s.key}">0</td>`).join("")}
              <td class="grand"><span class="pip pip-score" data-sum="total">0</span></td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>`;
}

function setText(el, v){
  if (el && el.textContent !== String(v)) el.textContent = String(v);
}

// Taps come in fast, so scores are patched in place rather than re-rendering the container —
// a rebuild per tap loses the :active state and gets sluggish once there are 3-4 cards. This is
// now the ONLY path Faraway's fame inputs go through too (they used to trigger a full
// renderFaraway() per keystroke).
function patchScores(){
  const container = document.getElementById("players");
  if (!container) return;

  const totals = players.map(p => scorer.total(p));
  const maxTotal = totals.length ? Math.max(...totals) : -1;
  const leaders = totals.filter(t => t === maxTotal && maxTotal > 0).length;

  players.forEach((p, idx) => {
    // Every view — player cards, category rows, review grid rows — tags its container with the
    // player id and uses the same data-pts-for / data-sum hooks, so one patch pass drives all of them.
    const card = container.querySelector(`[data-pid="${p.id}"]`);
    if (!card) return;

    const b = scorer.breakdown(p);
    // Deliberately `players.length > 1`, NOT `game.minPlayers` — this gates "a solo player isn't
    // a winner" (you can't beat nobody), a different question from the game's legal minimum
    // (which gates the remove-player button in renderByPlayer instead).
    const isWinner = totals[idx] === maxTotal && maxTotal > 0 && players.length > 1;
    card.classList.toggle("winner", isWinner);

    const crown = card.querySelector(".crown");
    if (crown) crown.classList.toggle("hidden", !(isWinner && leaders === 1));
    card.querySelectorAll(".total-badge").forEach(el => setText(el, b.total));

    card.querySelectorAll("[data-pts-for]").forEach(el => {
      setText(el, scorer.catPoints(p, el.dataset.ptsFor));
    });
    card.querySelectorAll("[data-count-for]").forEach(el => {
      const [path, key] = el.dataset.countFor.split(":");
      setText(el, getCount(p, path, key));
    });
    card.querySelectorAll("[data-minus-for]").forEach(el => {
      const [path, key] = el.dataset.minusFor.split(":");
      el.disabled = getCount(p, path, key) <= Number(el.dataset.min || 0);
    });

    // Generic ladder patching: find the category that owns this `.ladder` via its enclosing
    // `[data-cat]`, and — only if that descriptor declares `activeRung` — light the matching rung.
    // Length 0 lights none, same as before: `activeRung` returns 0 and no rung's data-rung is "0".
    card.querySelectorAll(".ladder").forEach(ladder => {
      const catEl = ladder.closest("[data-cat]");
      const key = catEl && catEl.dataset.cat;
      const c = key && scorer.cat(key);
      if (!c || !c.activeRung) return;
      const active = c.activeRung(p, variant());
      ladder.querySelectorAll("[data-rung]").forEach(r => {
        r.classList.toggle("on", Number(r.dataset.rung) === active);
      });
    });

    card.querySelectorAll("[data-sum]").forEach(el => setText(el, b[el.dataset.sum]));

    // "Show your working" lines rebuild their inner markup rather than a single number, so they
    // are patched by innerHTML. Same rule as every other hook: if a category renders one and it
    // isn't wired here, it silently freezes — src/ui/card.test.js asserts the hook is present.
    card.querySelectorAll("[data-work-for]").forEach(el => {
      const c = scorer.cat(el.dataset.workFor);
      if (c && c.work) el.innerHTML = c.work(p, variant());
    });
  });
}

// Swaps a count chip for a text field in place. The chip node itself is put back on commit, so
// nothing around it is rebuilt — if this re-rendered the card, a tap on a token while the field
// was focused would blur it, destroy the token, and lose the tap.
function startCountEdit(chip, p){
  const path = chip.dataset.path;
  const key = chip.dataset.key;
  const min = Number(chip.dataset.min || 0);

  const input = document.createElement("input");
  input.type = "number";
  input.min = min;
  input.inputMode = "numeric";
  input.className = "count-input";
  input.value = getCount(p, path, key);
  input.dataset.role = "countInput";
  input.dataset.path = path;
  input.dataset.key = key;
  // carried through so typing a count marks the category done, exactly as tapping it does
  input.dataset.scoreCat = chip.dataset.scoreCat || "";

  let closed = false;
  const commit = () => {
    if (closed) return;
    closed = true;
    setCount(p, path, key, Math.max(min, Math.trunc(numOf(input.value))));
    input.replaceWith(chip);
    patchScores();
  };

  input.addEventListener("blur", commit);
  // Some mobile keyboards commit without ever firing blur.
  input.addEventListener("change", commit);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === "Escape"){
      e.preventDefault();
      input.blur();
      commit();
    }
  });

  chip.replaceWith(input);
  input.focus();
  input.select();

  // If focus did not really take, blur will never fire and the field would be stranded in place —
  // which also loses the data-count-for hook that keeps it in sync. focus() still sets
  // activeElement on an unfocused document, so check hasFocus() too. Nobody is typing into an
  // unfocused document, so committing straight back to a chip is the right degradation.
  if (!document.hasFocus() || document.activeElement !== input) commit();
}

function wireCard(card, p){
  const nameInput = card.querySelector('[data-role="name"]');
  if (nameInput) nameInput.addEventListener("input", e => { p.name = e.target.value; });

  card.addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (!btn || !card.contains(btn)) return;
    const d = btn.dataset;
    const cat = d.cat;

    switch (d.role){
      case "tally":
        bumpCount(p, d.path, d.key, 1, Number(d.min || 0));
        markDone(d.scoreCat);
        patchScores();
        break;
      case "minus":
        bumpCount(p, d.path, d.key, -1, Number(d.min || 0));
        markDone(d.scoreCat);
        patchScores();
        break;
      case "editCount":
        startCountEdit(btn, p);
        break;
      case "resetCat":
        scorer.resetCat(p, cat);
        render();
        break;
      case "toTotal":
        // Seed with the current derived score so switching modes freezes the value rather
        // than changing it.
        p.totals[cat] = scorer.catPoints(p, cat);
        render();
        focusTotalInput(p.id, cat);
        break;
      case "revert":
        delete p.totals[cat];
        render();
        break;
      case "openCat":
        if (p.open.has(cat)) p.open.delete(cat); else p.open.add(cat);
        render();
        break;
      case "toggleAll":
        if (p.open.size === scorer.keys.length) p.open.clear();
        else scorer.keys.forEach(k => p.open.add(k));
        render();
        break;
      case "resetPlayer":
        if (confirm(`Reset every category for ${p.name || "this player"}?`)){
          scorer.resetPlayer(p);
          render();
        }
        break;
      case "remove":
        players = players.filter(pl => pl.id !== p.id);
        render();
        break;
      case "listAdd":
        p[scorer.cat(cat).listField].push(0);
        render();
        break;
      case "listRemove":
        p[scorer.cat(cat).listField].splice(Number(d.index), 1);
        render();
        break;
    }
  });

  card.addEventListener("input", e => {
    const d = e.target.dataset;
    switch (d.role){
      case "listInput":  p[scorer.cat(d.cat).listField][Number(d.index)] = e.target.value; markDone(d.cat); patchScores(); break;
      case "numInput":   p[scorer.cat(d.cat).valueField] = e.target.value; markDone(d.cat); patchScores(); break;
      case "totalInput": p.totals[d.cat] = e.target.value; markDone(d.cat); patchScores(); break;
      case "countInput": setCount(p, d.path, d.key, e.target.value); markDone(d.scoreCat); patchScores(); break;
    }
  });

  // Inference runs on commit, not per keystroke — mid-typing "1" of "15" would otherwise
  // snap the category back to tally mode under the cursor.
  card.addEventListener("focusout", e => {
    const d = e.target.dataset;
    if (d.role !== "totalInput") return;
    if (scorer.infer(p, d.cat, e.target.value)){
      delete p.totals[d.cat];
      render();
    }
  });
}

function markDone(cat){
  if (cat && !doneCats.has(cat)) doneCats.add(cat);
}

function focusTotalInput(playerId, cat){
  const el = document.querySelector(`[data-uid="p${playerId}-total-${cat}"]`);
  if (el){ el.focus(); el.select(); }
}

// Chrome for the two modes lives above the cards, so it is delegated on the container rather
// than wired per card.
document.getElementById("players").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;

  switch (btn.dataset.role){
    case "pickCat":
      activeCat = btn.dataset.cat;
      render();
      break;
    case "nextCat":
      // Moving on is itself an answer — a category everyone legitimately scored 0 in still
      // deserves its tick, or the strip reads as unfinished forever.
      markDone(activeCat);
      activeCat = nextUndoneCat();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      break;
  }
});

document.getElementById("modeToggle").addEventListener("click", e => {

  render();
});

document.getElementById("rulesToggle").addEventListener("click", e => {

document.getElementById("waterToggle").addEventListener("click", e => {

document.getElementById("newGame").addEventListener("click", () => {

});

function showView(name){
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + name));
  document.getElementById("footerBar").style.display = name === "scorer" ? "flex" : "none";

  // Lets a game restyle its own scorer through CSS custom properties (7 Wonders takes the
  // wordmark's gold for its pips) without any game-specific branching in the render code.
  if (game) document.getElementById("view-scorer").dataset.game = game.key;

  const logoWrap = document.getElementById("logoWrap");
  const masthead = document.getElementById("masthead");
  const showCritters = name !== "picker" && !!(game && game.critters);

    document.getElementById("scorerSubtitle").textContent = game.subtitle;
  }

  if (name === "landing") renderLandingChips();
}

let chipsRequestId = 0;

async function fetchProfiles(){
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);
  try {
    const res = await fetch("/api/profiles?game=" + encodeURIComponent(activeGame), { signal: controller.signal });
    if (!res.ok) throw new Error("bad_status");
    const data = await res.json();
    return data.profiles || [];
  } finally {
    clearTimeout(timeout);
  }
}

async function renderLandingChips(){
  const container = document.getElementById("landingChips");
  const requestId = ++chipsRequestId;
  container.innerHTML = '<div class="chip-loading">Loading players…</div>';

  let profiles;
  try {
    profiles = await fetchProfiles();
  } catch (err) {
    if (requestId !== chipsRequestId) return;
    container.innerHTML = '<div class="chip-loading">Couldn\'t load saved players. <button class="link-btn" id="retryChips">Retry</button></div>';
    const retry = document.getElementById("retryChips");
    if (retry) retry.addEventListener("click", renderLandingChips);
    return;
  }

  if (requestId !== chipsRequestId) return;

  if (!profiles.length){
    container.innerHTML = "";
    return;
  }

  container.innerHTML = profiles.map(p => `
    <div class="chip">
      <button data-role="chip-continue" data-key="${escapeAttr(p.key)}" data-name="${escapeAttr(p.displayName)}">${escapeAttr(p.displayName)}</button>
      <span class="chip-meta">🏆 ${numOf(p.highScore)}</span>
      <button class="chip-history" data-role="chip-history" data-key="${escapeAttr(p.key)}" title="View history">📜</button>
    </div>
  `).join("");

  container.querySelectorAll('[data-role="chip-continue"]').forEach(btn => {
    btn.addEventListener("click", () => startScorerWithName(btn.dataset.name));
  });
  container.querySelectorAll('[data-role="chip-history"]').forEach(btn => {
    btn.addEventListener("click", () => openHistory(btn.dataset.key));
  });
}

function startScorerWithName(name){
  players[0].name = name;

}

// ---- Save this game ----

function hideSaveBanner(bannerId = "saveBanner"){
  const el = document.getElementById(bannerId);
  el.className = "save-banner";
  el.innerHTML = "";
}

function renderSaveBanner(kind, html, bannerId = "saveBanner"){
  const el = document.getElementById(bannerId);
  el.className = "save-banner visible " + kind;
  el.innerHTML = html;
}

async function submitGame(gameKey, buildPlayers, btnId, bannerId, retryFn){
  const btn = document.getElementById(btnId);
  btn.disabled = true;
  btn.textContent = "Saving…";

  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 10000);
    let res;
    try {
      res = await fetch("/api/save-game", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ game: gameKey, players: buildPlayers() }),
        signal: controller.signal
      });
    } finally {
      clearTimeout(timeout);
    }
    if (!res.ok) throw new Error("bad_status");
    const data = await res.json();

    if (data.celebrations && data.celebrations.length){
      const lines = data.celebrations.map(c =>
        `🎉 New high score for ${escapeAttr(c.displayName)} — ${c.total} (previous best ${c.previousHigh})!`
      ).join("<br>");
      renderSaveBanner("celebrate", lines, bannerId);
    } else if (data.saved && data.saved.length){
      renderSaveBanner("info", `Saved ${data.saved.length} player${data.saved.length === 1 ? "" : "s"}' game${data.saved.length === 1 ? "" : "s"}.`, bannerId);
    } else {
      renderSaveBanner("info", "No named players to save — give someone a real name first.", bannerId);
    }
  } catch (err) {
    renderSaveBanner("error", `Couldn't save — check your connection and try again. <button class="retry-btn" id="retrySave-${btnId}">Retry</button>`, bannerId);
    const retry = document.getElementById(`retrySave-${btnId}`);
    if (retry) retry.addEventListener("click", retryFn);
  } finally {
    btn.disabled = false;
    btn.textContent = "Save this game";
  }
}

function saveGame(){
  return submitGame(
    activeGame,
    () => players.map(p => ({ name: p.name, total: scorer.total(p) })),
    "saveGame", "saveBanner", saveGame
  );
}

document.getElementById("saveGame").addEventListener("click", saveGame);

let currentHistoryKey = null;
let historyRequestId = 0;

function openHistory(key){
  currentHistoryKey = key;
  showView("history");
  renderHistory(key);
}

async function renderHistory(key){
  const requestId = ++historyRequestId;
  document.getElementById("historyName").textContent = "";
  document.getElementById("historyHighScore").textContent = "";
  document.getElementById("historyList").innerHTML = '<div class="history-empty">Loading…</div>';

  let data;
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 10000);
    let res;
    try {
      res = await fetch("/api/profile?name=" + encodeURIComponent(key) + "&game=" + encodeURIComponent(activeGame), { signal: controller.signal });
    } finally {
      clearTimeout(timeout);
    }
    if (res.status === 404){
      if (requestId !== historyRequestId) return;
      document.getElementById("historyList").innerHTML = '<div class="history-empty">No history yet.</div>';
      return;
    }
    if (!res.ok) throw new Error("bad_status");
    data = await res.json();
  } catch (err) {
    if (requestId !== historyRequestId) return;
    document.getElementById("historyList").innerHTML = '<div class="history-empty">Couldn\'t load history. <button class="link-btn" id="retryHistory">Retry</button></div>';
    const retry = document.getElementById("retryHistory");
    if (retry) retry.addEventListener("click", () => renderHistory(key));
    return;
  }

  if (requestId !== historyRequestId) return;

  document.getElementById("historyName").textContent = data.displayName;
  document.getElementById("historyHighScore").textContent = "🏆 High score: " + data.highScore;
  document.getElementById("historyList").innerHTML = data.games.map(g => `
    <div class="history-row${g.total === data.highScore ? " is-best" : ""}">
      <span>${formatDate(g.playedAt)}</span><span>${g.total}</span>
    </div>
  `).join("") || '<div class="history-empty">No games yet.</div>';
}

document.getElementById("historyBack").addEventListener("click", () => showView("landing"));

// ---- Leaderboard ----

let leaderboardRequestId = 0;

async function renderLeaderboard(){
  const requestId = ++leaderboardRequestId;
  const list = document.getElementById("leaderboardList");
  list.innerHTML = '<div class="history-empty">Loading…</div>';

  let data;
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 10000);
    let res;
    try {
      res = await fetch("/api/leaderboard?game=" + encodeURIComponent(activeGame), { signal: controller.signal });
    } finally {
      clearTimeout(timeout);
    }
    if (!res.ok) throw new Error("bad_status");
    data = await res.json();
  } catch (err) {
    if (requestId !== leaderboardRequestId) return;
    list.innerHTML = '<div class="history-empty">Couldn\'t load leaderboard. <button class="link-btn" id="retryLeaderboard">Retry</button></div>';
    const retry = document.getElementById("retryLeaderboard");
    if (retry) retry.addEventListener("click", renderLeaderboard);
    return;
  }

  if (requestId !== leaderboardRequestId) return;

  const rows = data.leaderboard || [];
  list.innerHTML = rows.map((p, i) => `
    <div class="history-row${i < 3 ? " top-3" : ""}">
      <span class="rank">#${i + 1}</span>
      <span class="name">${escapeAttr(p.displayName)}</span>
      <span>${p.highScore}</span>
    </div>
  `).join("") || '<div class="history-empty">No games saved yet.</div>';
}

document.getElementById("landingLeaderboard").addEventListener("click", () => {
  showView("leaderboard");
  renderLeaderboard();
});
document.getElementById("scorerLeaderboard").addEventListener("click", () => {
  showView("leaderboard");
  renderLeaderboard();
});
document.getElementById("leaderboardBack").addEventListener("click", () => showView("landing"));

// ---- Boot ----

// showRules is restored from localStorage, so the button has to catch up to it.
(() => {
  const rt = document.getElementById("rulesToggle");
  rt.classList.toggle("active", showRules);
  rt.setAttribute("aria-pressed", String(showRules));
})();

showView("picker");
</script>
