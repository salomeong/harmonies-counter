<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Faithful Tally</title>
<link rel="icon" href="assets/logo.png">
<style>
  :root{
    --bg: #eee2c6;
    --card: #fbf6e9;
    --ink: #2f3b2f;
    --muted: #6b7a6b;
    --line: #ddd0ab;
    --green: #4f8f6d;
    --green-dark: #2d6e5e;
    --blue: #3f7ea6;
    --tan: #b98a4a;
    --gray: #8a8578;
    --red: #b0524a;
    --yellow: #d1a239;
    --accent: #e0871f;
    --winner: #fbead0;
    --accent-text: var(--green-dark);

    /* real Harmonies token colors, from the rulebook component key */
    --tok-water: #4a92ad;
    --tok-mountain: #9a9690;
    --tok-brown: #96603c;
    --tok-tree: #8a9a3f;
    --tok-field: #e8b93a;
    --tok-building: #c1483f;

    /* side walls of the drawn tokens — each hue darkened ~20% */
    --tok-water-d: #35708a;
    --tok-mountain-d: #78746e;
    --tok-brown-d: #74482c;
    --tok-tree-d: #69762f;
    --tok-field-d: #bf9320;
    --tok-building-d: #98352d;

    /* the cream hex recess a token sits in */
    --tok-slot: #e4d2a6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: #1b211a;
      --card: #262c23;
      --ink: #ece6d6;
      --muted: #a3ad98;
      --line: #3c4436;
      --winner: #40371f;
      --accent-text: #7fd9ab;
      --tok-slot: #3f4735;
    }
  }
  :root[data-theme="dark"]{
    --bg: #1b211a; --card: #262c23; --ink: #ece6d6; --muted: #a3ad98; --line: #3c4436; --winner: #40371f;
    --accent-text: #7fd9ab;
    --tok-slot: #3f4735;
  }
  :root[data-theme="light"]{
    --bg: #eee2c6; --card: #fbf6e9; --ink: #2f3b2f; --muted: #6b7a6b; --line: #ddd0ab; --winner: #fbead0;
    --tok-slot: #e4d2a6;
  }
  *{ box-sizing: border-box; }
  html, body{
    max-width: 100vw;
    overflow-x: hidden;
  }
  body{
    margin: 0;
    font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      linear-gradient(rgba(255,251,240,0.55), rgba(255,251,240,0.55)),
      var(--bg) url("assets/parchment-bg.jpg") center / cover fixed no-repeat;
    color: var(--ink);
    padding: 16px;
    padding-bottom: 100px;
    position: relative;
    min-height: 100vh;
  }
  @media (prefers-color-scheme: dark){
    body{
      background:
        linear-gradient(rgba(10,14,9,0.78), rgba(10,14,9,0.78)),
        var(--bg) url("assets/parchment-bg.jpg") center / cover fixed no-repeat;
    }
  }
  :root[data-theme="dark"] body{
    background:
      linear-gradient(rgba(10,14,9,0.78), rgba(10,14,9,0.78)),
      var(--bg) url("assets/parchment-bg.jpg") center / cover fixed no-repeat;
  }
  :root[data-theme="light"] body{
    background:
      linear-gradient(rgba(255,251,240,0.55), rgba(255,251,240,0.55)),
      var(--bg) url("assets/parchment-bg.jpg") center / cover fixed no-repeat;
  }
  .corner-critter{
    position: fixed;
    width: 130px;
    opacity: 0.9;
    pointer-events: none;
    z-index: 0;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.15));
  }
  .corner-critter.fennec{
    left: -18px;
    bottom: -10px;
    width: 150px;
    transform: scaleX(-1);
  }
  .corner-critter.bird{
    right: -10px;
    top: 6px;
    width: 100px;
  }
  @media (max-width: 700px){
    .corner-critter{ display: none; }
  }
  .page-inner{
    position: relative;
    z-index: 1;
  }
  .logo-wrap{
    display: flex;
    justify-content: center;
    margin-bottom: 2px;
  }
  .logo-wrap.hidden{ display: none; }
  .logo-wrap img{
    width: min(70vw, 300px);
    height: auto;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.12));
  }
  @media (prefers-color-scheme: dark){
    .logo-wrap img{ filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4)) brightness(1.15); }
  }
  :root[data-theme="dark"] .logo-wrap img{
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4)) brightness(1.15);
  }
  :root[data-theme="light"] .logo-wrap img{
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.12));
  }
  h1{
    font-size: 1.4rem;
    margin: 4px 0 2px;
    text-align: center;
  }
  .site-name{
    text-align: center;
    font-size: 1.5rem;
    letter-spacing: 0.06em;
    color: var(--ink);
    margin: 4px 0 2px;
  }
  .subtitle{
    text-align: center;
    color: var(--accent-text);
    font-size: 0.85rem;
    font-style: italic;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .global-settings{
    max-width: 640px;
    margin: 0 auto 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 10px;
    display: flex;
    /* wrap is the last resort: on a 320px screen a second row beats silently clipping
       "Category" and "Islands" against .toggle-group's overflow:hidden */
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .toggle-group{
    display: flex;
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .toggle-group button{
    border: none;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    padding: 7px 10px;
    font-size: 0.79rem;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
  }
  .toggle-group button.active{
    background: var(--tok-water);
    color: white;
  }
  .players{
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .player-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 14px 14px;
    position: relative;
    box-shadow: 0 2px 10px rgba(60,45,20,0.06);
    overflow: hidden;
  }
  .player-card::before{
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg,
      var(--tok-water) 0 20%,
      var(--tok-field) 20% 40%,
      var(--tok-tree) 40% 60%,
      var(--tok-mountain) 60% 80%,
      var(--tok-building) 80% 100%);
  }
  .player-card.winner{
    background: var(--winner);
    border-color: var(--accent);
    box-shadow: 0 4px 18px rgba(224,135,31,0.25);
  }
  .player-header{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .mascot{
    width: 38px;
    height: 38px;
    border-radius: 50%;
    object-fit: cover;
    object-position: center 20%;
    background: var(--bg);
    border: 2px solid var(--line);
    flex-shrink: 0;
  }
  .player-card.winner .mascot{
    border-color: var(--accent);
  }
  .player-header input[type="text"]{
    flex: 1;
    min-width: 0;
    font-size: 1.05rem;
    font-weight: 600;
    border: none;
    background: transparent;
    color: var(--ink);
    padding: 4px 2px;
    border-bottom: 1px solid transparent;
  }
  .player-header input[type="text"]:focus{
    outline: none;
    border-bottom: 1px solid var(--line);
  }
  .remove-player{
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 1.1rem;
    cursor: pointer;
    padding: 2px 6px;
  }
  /* ---- points vs counts ----
     On the physical components every point value sits inside a coloured bubble and nothing else
     does. Borrowing that rule outright: a number in a blob is ALWAYS points, a bare numeral is
     ALWAYS a count. That is what separates the "7" a token is worth from the "×3" you have. */
  /* One colour for every point value. Tying each pip to its token colour looked tempting, but
     white on --tok-field measures 1.84:1 and on --tok-tree 3.10:1 — both fail AA at this size.
     A single ink also makes the "blob = points" rule read harder. */
  .pip{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--pip, var(--green-dark));
    color: #fff;
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    line-height: 1;
    font-size: 0.72rem;
    letter-spacing: 0.01em;
    min-width: 1.9em;
    padding: 3px 6px;
    /* irregular, like the printed blobs on the component key rather than a UI chip */
    border-radius: 46% 54% 52% 48% / 54% 46% 54% 46%;
    text-shadow: 0 1px 1px rgba(0,0,0,0.28);
    box-shadow: inset 0 -1px 2px rgba(0,0,0,0.22), inset 0 1px 1px rgba(255,255,255,0.28);
  }
  .pip-score{
    font-size: 0.86rem;
    padding: 5px 9px;
    min-width: 2.2em;
  }
  /* white on --accent is only 2.74:1, so the grand total carries dark ink instead — 5.84:1 */
  .pip-total{
    --pip: var(--accent);
    color: #1b2416;
    text-shadow: none;
    font-size: 1.05rem;
    padding: 6px 11px;
    min-width: 2.4em;
  }
  .pip-sub{
    --pip: transparent;
    color: var(--ink);
    font-weight: 700;
    text-shadow: none;
    box-shadow: none;
    border: 1.5px solid var(--line);
    padding: 2px 6px;
  }
  .total-badge{ flex-shrink: 0; }

  /* Counts are what you are actively changing, so they get the weight — but never a blob. */
  .count-pre{
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--muted);
    margin-right: 1px;
  }
  .count-num{
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .category{
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 6px 10px;
    padding: 8px 0;
    border-top: 1px solid var(--line);
  }
  .category:first-of-type{ border-top: none; }
  .cat-label{
    font-size: 0.88rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .tok-dot{
    display: inline-block;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    box-shadow: inset 0 -2px 2px rgba(0,0,0,0.25), inset 0 1px 1px rgba(255,255,255,0.4);
    flex-shrink: 0;
  }
  .cat-hint{
    font-size: 0.74rem;
    color: var(--muted);
    grid-column: 1 / -1;
    margin-top: -2px;
  }
  .subrow{
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .num-input{
    width: 3.2em;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    border-radius: 8px;
    padding: 4px 4px;
    font-size: 0.95rem;
    text-align: center;
  }
  .animal-list{
    grid-column: 1 / -1;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .animal-row{
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .animal-row input[type="number"]{
    width: 4em;
  }
  .animal-row button{
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 1rem;
    cursor: pointer;
  }
  .add-btn{
    align-self: flex-start;
    border: 1px dashed var(--line);
    background: transparent;
    color: var(--accent-text);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 0.8rem;
    cursor: pointer;
    margin-top: 2px;
  }

  /* ---- tally rows ---- */
  .tally-group{
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .tally{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .tally-btn{
    width: 68px;
    min-height: 56px;
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 12px;
    padding: 4px 2px 2px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    cursor: pointer;
    /* the row is tapped fast and repeatedly — never let a tap select text or fire a zoom */
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: manipulation;
    transition: transform 0.06s ease, background 0.12s ease;
  }
  .tally-btn:active{
    transform: scale(0.94);
    background: var(--winner);
  }
  .tok-art{
    width: 40px;
    height: 40px;
    display: block;
    pointer-events: none;
  }
  .tok-slot{ fill: var(--tok-slot); }
  .tally-btn .pip{ pointer-events: none; }
  .tally-cap{
    font-size: 0.66rem;
    font-weight: 600;
    color: var(--muted);
    line-height: 1;
    pointer-events: none;
  }
  .tally-count{
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .count-chip{
    border: none;
    background: transparent;
    font-family: inherit;
    display: inline-flex;
    align-items: baseline;
    padding: 6px 4px;
    min-width: 2.6em;
    min-height: 32px;
    justify-content: flex-end;
    cursor: pointer;
    border-bottom: 1px dashed var(--line);
    position: relative;
  }
  .count-input{
    width: 3.2em;
    border: 1px solid var(--accent);
    background: var(--card);
    color: var(--ink);
    border-radius: 6px;
    padding: 1px 4px;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    text-align: center;
  }
  .minus{
    width: 32px;
    height: 32px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    border-radius: 50%;
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
    position: relative;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  /* Stretch the touch target to 44px vertically without growing the layout. Only vertically —
     these sit shoulder to shoulder, so a horizontal expander would steal its neighbour's taps. */
  .count-chip::after,
  .minus::after{
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 44px;
    transform: translateY(-50%);
  }
  /* kept in the layout at 0 rather than hidden — a control that appears on first tap
     reflows the row under a moving finger */
  .minus:disabled{
    opacity: 0.3;
    cursor: default;
  }

  /* shared with the Faraway scorer, which still uses the plain label/score grid */
  .cat-pts{
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--accent-text);
    text-align: right;
  }

  /* ---- accordion category (Harmonies) ---- */
  .category.acc{
    display: block;
    padding: 0;
  }
  .cat-head{
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    border: none;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 600;
    text-align: left;
    padding: 11px 2px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .cat-name{ flex: 1; min-width: 0; }
  .card-tools{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 2px 0 10px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 2px;
  }
  .mini-btn.danger{
    color: var(--red);
    border-color: color-mix(in srgb, var(--red) 40%, transparent);
  }
  .rules-toggle{
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 800;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .rules-toggle.active{
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  /* Shrink the settings controls before letting them wrap, so one row survives down to the
     narrowest common phones. Must come after the base .toggle-group button rule to win. */
  @media (max-width: 372px){
    .global-settings{ padding: 7px 7px; gap: 3px; }
    .toggle-group button{ padding: 7px 6px; font-size: 0.72rem; }
    .rules-toggle{ width: 26px; height: 26px; font-size: 0.82rem; }
  }
  .chev{
    color: var(--muted);
    font-size: 0.9rem;
    width: 1em;
    text-align: center;
  }
  .cat-body{
    padding: 0 2px 8px;
  }
  .cat-actions{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }
  .mini-btn{
    border: 1px solid var(--line);
    background: transparent;
    color: var(--accent-text);
    font-family: inherit;
    font-size: 0.76rem;
    font-weight: 600;
    border-radius: 999px;
    padding: 7px 12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .category.acc .cat-hint{
    margin: 0 2px 10px;
  }
  .total-edit{
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .total-input{
    width: 4em;
    border: 1px solid var(--accent);
    background: var(--card);
    color: var(--ink);
    border-radius: 8px;
    padding: 5px 6px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    text-align: center;
  }
  .revert-btn{
    width: 30px;
    height: 30px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    border-radius: 50%;
    font-size: 0.95rem;
    line-height: 1;
    cursor: pointer;
    padding: 0;
  }

  /* ---- river ladder ---- */
  .ladder{
    grid-column: 1 / -1;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 2px;
  }
  /* Ladder rungs are point values, so they take the blob shape like every other point on screen */
  .rung{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    background: color-mix(in srgb, var(--tok-water) 18%, transparent);
    border-radius: 46% 54% 52% 48% / 54% 46% 54% 46%;
    padding: 4px 7px;
    min-width: 2.2em;
    transition: transform 0.12s ease;
  }
  /* dark ink on the water blue: 4.58:1, where white would only manage 3.50:1 */
  .rung.on{
    background: var(--tok-water);
    color: #1b2416;
    transform: scale(1.14);
    box-shadow: inset 0 -1px 2px rgba(0,0,0,0.18), inset 0 1px 1px rgba(255,255,255,0.3);
  }

  /* ---- by-category mode ---- */
  .cat-tabs{
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 6px 2px 10px;
    scrollbar-width: none;
  }
  .cat-tabs::-webkit-scrollbar{ display: none; }
  .cat-tab{
    position: relative;
    flex: 0 0 auto;
    width: 50px;
    height: 50px;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 12px;
    cursor: pointer;
    padding: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .cat-tab .tok-art{ width: 34px; height: 34px; }
  .cat-tab.active{
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(224,135,31,0.25);
  }
  .cat-tab.review{
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent-text);
  }
  .tab-glyph{ font-size: 1.3rem; }
  .cat-tab .tick{
    position: absolute;
    top: -4px;
    right: -4px;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: var(--green);
    color: white;
    font-size: 0.62rem;
    line-height: 17px;
    text-align: center;
    display: none;
  }
  .cat-tab.done .tick{ display: block; }

  .cat-page{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 2px 10px rgba(60,45,20,0.06);
  }
  .cat-page-head{
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 1.05rem;
    font-weight: 700;
  }
  .cat-page-name{
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cat-page .cat-hint{ margin: 4px 0 10px; }
  .cat-row{
    border-top: 1px solid var(--line);
    padding: 8px 0;
  }
  .cat-row.winner .row-name{ color: var(--accent-text); }
  .row-head{
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .mascot.small{ width: 26px; height: 26px; border-width: 1px; }
  .row-name{
    flex: 1;
    min-width: 0;
    font-weight: 600;
    font-size: 0.9rem;
    overflow: hidden;
    text-overflow: ellipsis;

<script>
const STACK_PTS = { h1: 1, h2: 3, h3: 7 };

let activeGame = null;
let waterSide = "river";
let players = [];
let nextId = 1;

// "player" walks one player down all categories; "category" scores one category across everyone.
let scoreMode = "player";
let activeCat = "trees";
// Which categories the table has finished. Shared across players, because a category is called
// out once for everyone. A category counts as done when it is touched, or when you deliberately
// move past it — a player with no buildings scores a legitimate 0 and would never earn a tick.
let doneCats = new Set();
// Explanations are on for a first-timer and stay off once you know the rules.
let showRules = localStorage.getItem("tally.showRules") !== "0";

function newPlayer(name){
  return {
    id: nextId++,
    name: name || "Player " + nextId,
    trees: { h1: 0, h2: 0, h3: 0 },
    mountains: { h1: 0, h2: 0, h3: 0 },
    fields: 0,
    buildings: 0,
    river: 0,
    islands: 1,
    animals: [0],
    bonus: 0,
    // sparse per-category score overrides, for players who already did the sum in their head.
    // A key being present is what puts that category in "total mode".
    totals: {},
    // which categories are expanded on this player's card
    open: new Set(["trees"])
  };
}

function resetPlayer(p){
  CAT_ORDER.forEach(cat => resetCat(p, cat));
}

function resetCat(p, cat){
  delete p.totals[cat];
  switch (cat){
    case "trees":
    case "mountains": p[cat] = { h1: 0, h2: 0, h3: 0 }; break;
    case "fields":
    case "buildings": p[cat] = 0; break;
    case "water":     p.river = 0; p.islands = 1; break;
    case "animals":   p.animals = [0]; break;
    case "bonus":     p.bonus = 0; break;
  }
}

// Fields, buildings, islands and river are one number scaled by a known rule, so a typed total
// tells us the count outright. Recover it and drop back to tallying, rather than stranding the
// category on a frozen number the tally rows no longer agree with. Stacks and animal cards are
// genuinely ambiguous (13 could be many bucket combinations), so they keep the override.
function inferFromTotal(p, cat, raw){
  const total = Math.max(0, Math.trunc(numOf(raw)));

  if (cat === "fields" || cat === "buildings"){
    if (total % 5) return false;
    p[cat] = total / 5;
    return true;
  }

  if (cat === "water"){
    if (waterSide !== "river"){
      if (total % 5 || total < 5) return false;
      p.islands = total / 5;
      return true;
    }
    for (let len = 0; len <= 500; len++){
      if (riverPoints(len) === total){ p.river = len; return true; }
    }
    return false;
  }

  return false;
}

// ---- Token art ----
// The physical tokens are discs seen at a low angle sitting in a cream hex recess, so one
// cylinder helper (ellipse top face + extruded side wall) draws all of them; a tree is just a
// green disc stacked on 0/1/2 brown ones, a mountain is 1/2/3 grey ones.

const TOK_FILL = {
  tree:     ["--tok-tree", "--tok-tree-d"],
  brown:    ["--tok-brown", "--tok-brown-d"],
  mountain: ["--tok-mountain", "--tok-mountain-d"],
  field:    ["--tok-field", "--tok-field-d"],
  building: ["--tok-building", "--tok-building-d"],
  water:    ["--tok-water", "--tok-water-d"]
};

const TOK_RX = 30, TOK_RY = 12.6, TOK_WALL = 13, TOK_BASE = 88;

// Printed texture on the top face — a few shapes is enough to tell the tokens apart at 40px.
function tokenDetail(kind, cy){
  switch (kind){
    case "tree":
      return `<ellipse cx="41" cy="${cy - 2}" rx="6.5" ry="3.4" transform="rotate(-28 41 ${cy - 2})" fill="#c3d179"/>
              <ellipse cx="56" cy="${cy - 4}" rx="6" ry="3.2" transform="rotate(18 56 ${cy - 4})" fill="#c3d179"/>
              <ellipse cx="52" cy="${cy + 4}" rx="6.5" ry="3.4" transform="rotate(-12 52 ${cy + 4})" fill="#b3c268"/>`;
    case "mountain":
      return `<circle cx="43" cy="${cy - 2}" r="3.4" fill="#eae7e2"/>
              <circle cx="57" cy="${cy + 2}" r="2.4" fill="#eae7e2"/>`;
    case "water":
      return `<path d="M35 ${cy - 3} q7 -3.5 14 0 t14 0" fill="none" stroke="#a6d8ea" stroke-width="2.4" stroke-linecap="round"/>
              <path d="M35 ${cy + 4} q7 -3.5 14 0 t14 0" fill="none" stroke="#a6d8ea" stroke-width="2.4" stroke-linecap="round"/>`;
    case "field":
      return `<circle cx="42" cy="${cy - 1}" r="2.6" fill="#f8e29a"/>
              <circle cx="54" cy="${cy - 4}" r="2.2" fill="#f8e29a"/>
              <circle cx="55" cy="${cy + 3}" r="2.6" fill="#f8e29a"/>`;
    case "building":
      return `<rect x="44" y="${cy - 4.5}" width="12" height="9" rx="2.5" fill="#e6928a"/>`;
    default:
      return "";
  }
}

// i counts up from the bottom of the stack
function tokenDisc(kind, i, withDetail){
  const cy = TOK_BASE - TOK_RY - TOK_WALL - i * TOK_WALL;
  const [top, side] = TOK_FILL[kind];
  const left = 50 - TOK_RX;
  return `<path d="M${left} ${cy} v${TOK_WALL} a${TOK_RX} ${TOK_RY} 0 0 0 ${TOK_RX * 2} 0 v-${TOK_WALL} z" style="fill:var(${side})"/>
          <ellipse cx="50" cy="${cy}" rx="${TOK_RX}" ry="${TOK_RY}" style="fill:var(${top})"/>
          ${withDetail ? tokenDetail(kind, cy) : ""}`;
}

function tokenArt(kind, height){
  height = Math.max(1, height || 1);
  let body = "";
  if (kind === "tree"){
    for (let i = 0; i < height - 1; i++) body += tokenDisc("brown", i, false);
    body += tokenDisc("tree", height - 1, true);
  } else if (kind === "mountain"){
    for (let i = 0; i < height; i++) body += tokenDisc("mountain", i, i === height - 1);
  } else {
    body += tokenDisc(kind, 0, true);
  }
  return `<svg class="tok-art" viewBox="0 0 100 100" aria-hidden="true">
    <polygon class="tok-slot" points="12,72 31,53.9 69,53.9 88,72 69,90.1 31,90.1"/>
    ${body}
  </svg>`;
}

function numOf(v){
  const n = parseFloat(v);
  return Number.isFinite(n) ? n : 0;
}

function stackPoints(stack){
  return numOf(stack.h1) * STACK_PTS.h1 + numOf(stack.h2) * STACK_PTS.h2 + numOf(stack.h3) * STACK_PTS.h3;
}

function riverPoints(len){
  len = Math.max(0, Math.trunc(numOf(len)));
  if (len < 2) return 0;
  const table = { 2: 2, 3: 5, 4: 8, 5: 11, 6: 15 };
  if (len <= 6) return table[len];
  return 15 + (len - 6) * 4;
}

function animalPoints(p){
  return p.animals.reduce((sum, v) => sum + numOf(v), 0);
}

function waterPoints(p){
  return waterSide === "river" ? riverPoints(p.river) : Math.max(1, numOf(p.islands)) * 5;
}

const MASCOTS = [
  "assets/animal-fennec.png",
  "assets/animal-rabbit.png",
  "assets/animal-bird.png",
  "assets/animal-boar.png",
  "assets/animal-mouse.png"
];

// ---- Scoring ----
// Every score is read through catPoints(), so a category that has been overridden with a typed
// total behaves identically to one that was tallied. The badge, the "=" strip, the winner
// comparison and the save payload all funnel through breakdown() and cannot drift apart.

const LAND_CATS = ["trees", "mountains", "fields", "buildings", "water"];

function derivedPoints(p, cat){
  switch (cat){
    case "trees":     return stackPoints(p.trees);
    case "mountains": return stackPoints(p.mountains);
    case "fields":    return numOf(p.fields) * 5;
    case "buildings": return numOf(p.buildings) * 5;
    case "water":     return waterPoints(p);
    case "animals":   return animalPoints(p);
    case "bonus":     return numOf(p.bonus);
    default:          return 0;
  }
}

function isTotalMode(p, cat){
  return p.totals && p.totals[cat] != null;
}

function catPoints(p, cat){
  return isTotalMode(p, cat) ? numOf(p.totals[cat]) : derivedPoints(p, cat);
}

function breakdown(p){
  const landscape = LAND_CATS.reduce((sum, cat) => sum + catPoints(p, cat), 0);
  const animals = catPoints(p, "animals");
  const spirit = catPoints(p, "bonus");
  return { landscape, animals, spirit, total: landscape + animals + spirit };
}

function totalPoints(p){
  return breakdown(p).total;
}

const CAT_ORDER = ["trees", "mountains", "fields", "buildings", "water", "animals", "bonus"];

// Point values are derived from STACK_PTS, never restated — a pip that disagreed with the score
// it produces would recreate the exact confusion the pips exist to remove.
const STACK_KEYS = [
  { key: "h1", height: 1 },
  { key: "h2", height: 2 },
  { key: "h3", height: 3 }
].map(s => ({ ...s, pts: STACK_PTS[s.key] }));

function catMeta(cat){
  switch (cat){
    case "trees": return { label: "Trees", dot: "--tok-tree",
      hint: "1 green token on 0/1/2 brown = height 1/2/3, scoring 1/3/7 each" };
    case "mountains": return { label: "Mountains", dot: "--tok-mountain",
      hint: "Only count mountains adjacent to another mountain — scores 1/3/7 by height, else 0" };
    case "fields": return { label: "Fields", dot: "--tok-field",
      hint: "Each group of 2+ contiguous yellow tokens = 1 field, 5 pts each" };
    case "buildings": return { label: "Buildings", dot: "--tok-building",
      hint: "Red on brown/gray/red, surrounded by 3+ differently colored tokens — 5 pts each" };
    case "water": return waterSide === "river"
      ? { label: "River", dot: "--tok-water",
          hint: "Shortest path length of your longest river: 2→2, 3→5, 4→8, 5→11, 6→15, +4 per token beyond 6" }
      : { label: "Islands", dot: "--tok-water",
          hint: "5 pts per island (area cut off by blue tokens) — you always have at least 1" };
    case "animals": return { label: "Animal cards", dot: "--tok-brown",
      hint: "Points showing on the topmost empty slot of each card" };
    default: return { label: "Nature Spirit / bonus", dot: "--accent",
      hint: "Read directly off any Nature Spirit card effect" };
  }
}

// State lives at p[path] for a plain count, or p[path][key] for a stack bucket.
function getCount(p, path, key){
  return key ? numOf(p[path][key]) : numOf(p[path]);
}

function setCount(p, path, key, v){
  if (key) p[path][key] = v; else p[path] = v;
}

function bumpCount(p, path, key, delta, min){
  setCount(p, path, key, Math.max(min, Math.trunc(getCount(p, path, key)) + delta));
}

function tallyControl(o){
  const count = o.count;
  return `
    <div class="tally">
      <button class="tally-btn" data-role="tally" data-path="${o.path}" data-key="${o.key}"
              data-min="${o.min}" data-score-cat="${o.scoreCat}" aria-label="${escapeAttr(o.label)}">
        ${tokenArt(o.art, o.height || 1)}
        ${o.pip != null
          ? `<span class="pip">${o.pip}</span>`
          : `<span class="tally-cap">${o.cap}</span>`}
      </button>
      <div class="tally-count">
        <button class="count-chip" data-role="editCount" data-path="${o.path}" data-key="${o.key}"
                data-min="${o.min}" data-prefix="${o.prefix}" data-score-cat="${o.scoreCat}"
                aria-label="${escapeAttr(o.label)} — tap to type the count"
        ><span class="count-pre">${o.prefix}</span><span class="count-num" data-count-for="${o.path}:${o.key}">${count}</span></button>
        <button class="minus" data-role="minus" data-path="${o.path}" data-key="${o.key}"
                data-min="${o.min}" data-score-cat="${o.scoreCat}" data-minus-for="${o.path}:${o.key}"
                ${count <= o.min ? "disabled" : ""} aria-label="Remove one">−</button>
      </div>
    </div>`;
}

function riverLadder(p){
  const len = Math.max(0, Math.trunc(numOf(p.river)));
  const rungs = [1, 2, 3, 4, 5, 6].map(l => ({ l, txt: String(riverPoints(l)) }));
  rungs.push({ l: 7, txt: "+4" });
  return `<div class="ladder">${rungs.map(r => {
    const on = r.l === 7 ? len >= 7 : len === r.l;
    return `<span class="rung${on ? " on" : ""}" data-rung="${r.l}">${r.txt}</span>`;
  }).join("")}</div>`;
}

function catControls(p, cat){
  switch (cat){
    case "trees":
    case "mountains": {
      const art = cat === "trees" ? "tree" : "mountain";
      const noun = cat === "trees" ? "tree" : "mountain";
      return `<div class="tally-group">${STACK_KEYS.map(s => tallyControl({
        scoreCat: cat, path: cat, key: s.key, art, height: s.height, prefix: "×", min: 0,
        pip: s.pts,
        count: numOf(p[cat][s.key]),
        label: `Add a height-${s.height} ${noun}, ${s.pts} point${s.pts === 1 ? "" : "s"}`
      })).join("")}</div>`;
    }
    case "fields":
      return `<div class="tally-group">${tallyControl({
        scoreCat: "fields", path: "fields", key: "", art: "field", prefix: "×", min: 0,
        pip: 5,
        count: numOf(p.fields), label: "Add a field, 5 points"
      })}</div>`;
    case "buildings":
      return `<div class="tally-group">${tallyControl({
        scoreCat: "buildings", path: "buildings", key: "", art: "building", prefix: "×", min: 0,
        pip: 5,
        count: numOf(p.buildings), label: "Add a building, 5 points"
      })}</div>`;
    case "water":
      if (waterSide === "river"){
        return `<div class="tally-group">${tallyControl({
          scoreCat: "water", path: "river", key: "", art: "water", prefix: "len ", min: 0,
          cap: "+1 tile",
          count: numOf(p.river), label: "Extend the river by one token"
        })}</div>${riverLadder(p)}`;
      }
      return `<div class="tally-group">${tallyControl({
        scoreCat: "water", path: "islands", key: "", art: "water", prefix: "×", min: 1,
        pip: 5,
        count: Math.max(1, numOf(p.islands)), label: "Add an island, 5 points"
      })}</div>`;
    case "animals":
      return `
        <div class="animal-list">
          ${p.animals.map((v, i) => `
            <div class="animal-row">
              <input class="num-input" type="number" min="0" inputmode="numeric" value="${escapeAttr(v)}" data-role="animal" data-index="${i}" data-uid="p${p.id}-animal-${i}" />
              ${p.animals.length > 1 ? `<button data-role="removeAnimal" data-index="${i}" aria-label="Remove this card">✕</button>` : ''}
            </div>
          `).join("")}
          <button class="add-btn" data-role="addAnimal">+ Add card</button>
        </div>`;
    default:
      return `<div class="subrow">${numField(p.id, "bonus", p.bonus, "extra points")}</div>`;
  }
}

// The scoring surface for one category: token buttons (or the frozen total), then the actions
// that get you out of trouble. Shared by both modes so they can never drift apart.
function catBody(p, cat){
  const meta = catMeta(cat);

  if (isTotalMode(p, cat)){
    return `
      <div class="cat-body">
        <div class="total-edit">
          <input class="total-input" type="number" min="0" inputmode="numeric"
                 value="${escapeAttr(p.totals[cat])}" data-role="totalInput" data-cat="${cat}"
                 data-uid="p${p.id}-total-${cat}" aria-label="${escapeAttr(meta.label)} total">
          <button class="revert-btn" data-role="revert" data-cat="${cat}"
                  title="Back to tallying" aria-label="Back to tallying">↺</button>
        </div>
      </div>`;
  }

  const canType = cat !== "bonus";
  return `
    <div class="cat-body">
      ${catControls(p, cat)}
      <div class="cat-actions">
        <button class="mini-btn" data-role="resetCat" data-cat="${cat}"
                aria-label="Reset ${escapeAttr(meta.label)} to zero">↺ Reset</button>
        ${canType ? `<button class="mini-btn" data-role="toTotal" data-cat="${cat}"
                aria-label="Type a total for ${escapeAttr(meta.label)} instead of tallying">✎ Enter total</button>` : ""}
      </div>
    </div>`;
}

// Collapsed rows are the whole point of the accordion: a filled-in card reads as seven short
// lines instead of seven full control panels. Drawers toggle independently so several can be
// open at once, and the card header can throw them all open in one tap.
function categoryBlock(p, cat){
  const meta = catMeta(cat);
  const open = p.open.has(cat);
  return `
    <div class="category acc${open ? " open" : ""}" data-cat="${cat}">
      <button class="cat-head" data-role="openCat" data-cat="${cat}" aria-expanded="${open}">
        <span class="tok-dot" style="background:var(${meta.dot})"></span>
        <span class="cat-name">${meta.label}</span>
        <span class="pip pip-score" data-pts-for="${cat}">${catPoints(p, cat)}</span>
        <span class="chev">${open ? "⌄" : "›"}</span>
      </button>
      ${open ? (showRules ? `<div class="cat-hint">${meta.hint}</div>` : "") + catBody(p, cat) : ""}
    </div>`;
}

function render(){
  const active = document.activeElement;
  let focusUid = null, selStart = null, selEnd = null;
  if (active && active.dataset && active.dataset.uid){
    focusUid = active.dataset.uid;
    if (typeof active.selectionStart === "number"){
      selStart = active.selectionStart;
      selEnd = active.selectionEnd;
    }
  }

  const container = document.getElementById("players");
  container.innerHTML = "";

  if (scoreMode === "category") renderByCategory(container);
  else renderByPlayer(container);

  patchScores();

  // The strip scrolls, so a tab picked from the far end must be brought back into view.
  const tab = container.querySelector(".cat-tab.active");
  if (tab) tab.scrollIntoView({ block: "nearest", inline: "center" });

  if (focusUid){
    const el = container.querySelector(`[data-uid="${focusUid}"]`);
    if (el){
      el.focus();
      if (selStart !== null && el.setSelectionRange){
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
}

function renderByPlayer(container){
  players.forEach((p, idx) => {
    const allOpen = p.open.size === CAT_ORDER.length;
    const card = document.createElement("div");
    card.className = "player-card";
    card.dataset.pid = p.id;

    card.innerHTML = `
      <div class="player-header">
        <img class="mascot" src="${MASCOTS[idx % MASCOTS.length]}" alt="">
        <input type="text" value="${escapeAttr(p.name)}" data-role="name" data-uid="p${p.id}-name" />
        <span class="crown hidden">👑</span>
        <span class="pip pip-total total-badge">0</span>
        ${players.length > 1 ? '<button class="remove-player" data-role="remove" aria-label="Remove player">✕</button>' : ''}
      </div>

      <div class="card-tools">
        <button class="mini-btn" data-role="toggleAll" aria-expanded="${allOpen}">
          ${allOpen ? "⌃ Collapse all" : "⌄ Expand all"}
        </button>
        <button class="mini-btn danger" data-role="resetPlayer">↺ Reset player</button>
      </div>

      ${CAT_ORDER.map(cat => categoryBlock(p, cat)).join("")}

      <div class="card-sum">
        <span>landscape <b class="pip pip-sub" data-sum="landscape">0</b></span>
        <span>+ animals <b class="pip pip-sub" data-sum="animals">0</b></span>
        <span>+ spirit <b class="pip pip-sub" data-sum="spirit">0</b></span>
        <span class="eq">=</span><span class="pip pip-total" data-sum="total">0</span>
      </div>
    `;

    container.appendChild(card);
    wireCard(card, p);
  });
}

// Small icon for the tab strip — the same drawn tokens as the buttons, so the strip reads as
// the same visual language rather than a separate icon set.
function catIcon(cat){
  switch (cat){
    case "trees":     return tokenArt("tree", 1);
    case "mountains": return tokenArt("mountain", 1);
    case "fields":    return tokenArt("field", 1);
    case "buildings": return tokenArt("building", 1);
    case "water":     return tokenArt("water", 1);
    case "animals":   return tokenArt("brown", 1);
    default:          return `<span class="tab-glyph">✨</span>`;
  }
}

function renderByCategory(container){
  const tabs = CAT_ORDER.map(cat => {
    const meta = catMeta(cat);
    return `
      <button class="cat-tab${activeCat === cat ? " active" : ""}${doneCats.has(cat) ? " done" : ""}"
              data-role="pickCat" data-cat="${cat}" aria-label="${escapeAttr(meta.label)}"
              aria-current="${activeCat === cat}">
        ${catIcon(cat)}
        <span class="tick" aria-hidden="true">✓</span>
      </button>`;
  }).join("");

  container.insertAdjacentHTML("beforeend", `
    <div class="cat-tabs" role="tablist">
      ${tabs}
      <button class="cat-tab review${activeCat === "__review" ? " active" : ""}"
              data-role="pickCat" data-cat="__review" aria-label="Review all scores">Σ</button>
    </div>`);

  if (activeCat === "__review"){
    container.insertAdjacentHTML("beforeend", reviewGrid());
    return;
  }

  const meta = catMeta(activeCat);
  const page = document.createElement("div");
  page.className = "cat-page";
  page.innerHTML = `
    <div class="cat-page-head">
      <span class="tok-dot" style="background:var(${meta.dot})"></span>
      <span class="cat-page-name">${meta.label}</span>
    </div>
    ${showRules ? `<div class="cat-hint">${meta.hint}</div>` : ""}
  `;
  container.appendChild(page);

  players.forEach((p, idx) => {
    const row = document.createElement("div");
    row.className = "cat-row";
    row.dataset.pid = p.id;
    row.innerHTML = `
      <div class="row-head">
        <img class="mascot small" src="${MASCOTS[idx % MASCOTS.length]}" alt="">
        <span class="row-name">${escapeAttr(p.name)}</span>
        <span class="pip pip-score" data-pts-for="${activeCat}">0</span>
        <span class="total-badge small">0</span>
      </div>
      ${catBody(p, activeCat)}
    `;
    page.appendChild(row);
    wireCard(row, p);
  });

  const next = nextUndoneCat();
  page.insertAdjacentHTML("beforeend", `
    <div class="cat-page-foot">
      <button class="mini-btn" data-role="nextCat">${next === "__review" ? "Review →" : catMeta(next).label + " →"}</button>
    </div>`);
}

// "Next" walks to the next category still needing attention rather than the next index, so the
// arrow stays useful however much you jumped around with the tabs.
function nextUndoneCat(){
  const start = CAT_ORDER.indexOf(activeCat);
  for (let i = 1; i <= CAT_ORDER.length; i++){
    const cat = CAT_ORDER[(start + i) % CAT_ORDER.length];
    if (!doneCats.has(cat) && cat !== activeCat) return cat;
  }
  return "__review";
}

const CAT_ABBR = { trees: "🌳", mountains: "⛰", fields: "🌾", buildings: "🏠", water: "💧", animals: "🐾", bonus: "✨" };

function reviewGrid(){
  return `
    <div class="review-grid-wrap">
      <table class="review-grid">
        <thead>
          <tr>
            <th class="who">Player</th>
            ${CAT_ORDER.map(c => `<th title="${escapeAttr(catMeta(c).label)}">${CAT_ABBR[c]}</th>`).join("")}
            <th class="sub">LAND</th><th class="sub">ANIM</th><th class="grand">TOTAL</th>
          </tr>
        </thead>
        <tbody>
          ${players.map(p => `
            <tr data-pid="${p.id}">
              <td class="who">${escapeAttr(p.name)}</td>
              ${CAT_ORDER.map(c => `<td data-pts-for="${c}">0</td>`).join("")}
              <td class="sub" data-sum="landscape">0</td>
              <td class="sub" data-sum="animals">0</td>
              <td class="grand"><span class="pip pip-score" data-sum="total">0</span></td>
            </tr>`).join("")}
        </tbody>
      </table>
    </div>`;
}

function setText(el, v){
  if (el && el.textContent !== String(v)) el.textContent = String(v);
}

// Taps come in fast, so scores are patched in place rather than re-rendering the container —
// a rebuild per tap loses the :active state and gets sluggish once there are 3-4 cards.
function patchScores(){
  const container = document.getElementById("players");
  if (!container) return;

  const totals = players.map(totalPoints);
  const maxTotal = totals.length ? Math.max(...totals) : -1;
  const leaders = totals.filter(t => t === maxTotal && maxTotal > 0).length;

  players.forEach((p, idx) => {
    // Every view — player cards, category rows, review grid rows — tags its container with the
    // player id and uses the same data-pts-for / data-sum hooks, so one patch pass drives all of them.
    const card = container.querySelector(`[data-pid="${p.id}"]`);
    if (!card) return;

    const b = breakdown(p);
    const isWinner = totals[idx] === maxTotal && maxTotal > 0 && players.length > 1;
    card.classList.toggle("winner", isWinner);

    const crown = card.querySelector(".crown");
    if (crown) crown.classList.toggle("hidden", !(isWinner && leaders === 1));
    card.querySelectorAll(".total-badge").forEach(el => setText(el, b.total));

    card.querySelectorAll("[data-pts-for]").forEach(el => {
      setText(el, catPoints(p, el.dataset.ptsFor));
    });
    card.querySelectorAll("[data-count-for]").forEach(el => {
      const [path, key] = el.dataset.countFor.split(":");
      setText(el, getCount(p, path, key));
    });
    card.querySelectorAll("[data-minus-for]").forEach(el => {
      const [path, key] = el.dataset.minusFor.split(":");
      el.disabled = getCount(p, path, key) <= Number(el.dataset.min || 0);
    });

    const ladder = card.querySelector(".ladder");
    if (ladder){
      const len = Math.max(0, Math.trunc(numOf(p.river)));
      ladder.querySelectorAll("[data-rung]").forEach(r => {
        const l = Number(r.dataset.rung);
        r.classList.toggle("on", l === 7 ? len >= 7 : len === l);
      });
    }

    card.querySelectorAll("[data-sum]").forEach(el => setText(el, b[el.dataset.sum]));
  });
}

function numField(playerId, role, value, placeholder){
  return `<input class="num-input" type="number" min="0" inputmode="numeric" value="${escapeAttr(value)}" data-role="${role}" placeholder="${placeholder}" data-uid="p${playerId}-${role}" />`;
}

function escapeAttr(s){
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

// Swaps a count chip for a text field in place. The chip node itself is put back on commit, so
// nothing around it is rebuilt — if this re-rendered the card, a tap on a token while the field
// was focused would blur it, destroy the token, and lose the tap.
function startCountEdit(chip, p){
  const path = chip.dataset.path;
  const key = chip.dataset.key;
  const min = Number(chip.dataset.min || 0);

  const input = document.createElement("input");
  input.type = "number";
  input.min = min;
  input.inputMode = "numeric";
  input.className = "count-input";
  input.value = getCount(p, path, key);
  input.dataset.role = "countInput";
  input.dataset.path = path;
  input.dataset.key = key;
  // carried through so typing a count marks the category done, exactly as tapping it does
  input.dataset.scoreCat = chip.dataset.scoreCat || "";

  let closed = false;
  const commit = () => {
    if (closed) return;
    closed = true;
    setCount(p, path, key, Math.max(min, Math.trunc(numOf(input.value))));
    input.replaceWith(chip);
    patchScores();
  };

  input.addEventListener("blur", commit);
  // Some mobile keyboards commit without ever firing blur.
  input.addEventListener("change", commit);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === "Escape"){
      e.preventDefault();
      input.blur();
      commit();
    }
  });

  chip.replaceWith(input);
  input.focus();
  input.select();

  // If focus did not really take, blur will never fire and the field would be stranded in place —
  // which also loses the data-count-for hook that keeps it in sync. focus() still sets
  // activeElement on an unfocused document, so check hasFocus() too. Nobody is typing into an
  // unfocused document, so committing straight back to a chip is the right degradation.
  if (!document.hasFocus() || document.activeElement !== input) commit();
}

function wireCard(card, p){
  const nameInput = card.querySelector('[data-role="name"]');
  if (nameInput) nameInput.addEventListener("input", e => { p.name = e.target.value; });

  card.addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (!btn || !card.contains(btn)) return;
    const d = btn.dataset;
    const cat = d.cat;

    switch (d.role){
      case "tally":
        bumpCount(p, d.path, d.key, 1, Number(d.min || 0));
        markDone(d.scoreCat);
        patchScores();
        break;
      case "minus":
        bumpCount(p, d.path, d.key, -1, Number(d.min || 0));
        markDone(d.scoreCat);
        patchScores();
        break;
      case "editCount":
        startCountEdit(btn, p);
        break;
      case "resetCat":
        resetCat(p, cat);
        render();
        break;
      case "toTotal":
        // Seed with the current derived score so switching modes freezes the value rather
        // than changing it.
        p.totals[cat] = catPoints(p, cat);
        render();
        focusTotalInput(p.id, cat);
        break;
      case "revert":
        delete p.totals[cat];
        render();
        break;
      case "openCat":
        if (p.open.has(cat)) p.open.delete(cat); else p.open.add(cat);
        render();
        break;
      case "toggleAll":
        if (p.open.size === CAT_ORDER.length) p.open.clear();
        else CAT_ORDER.forEach(c => p.open.add(c));
        render();
        break;
      case "resetPlayer":
        if (confirm(`Reset every category for ${p.name || "this player"}?`)){
          resetPlayer(p);
          render();
        }
        break;
      case "remove":
        players = players.filter(pl => pl.id !== p.id);
        render();
        break;
      case "addAnimal":
        p.animals.push(0);
        render();
        break;
      case "removeAnimal":
        p.animals.splice(Number(d.index), 1);
        render();
        break;
    }
  });

  card.addEventListener("input", e => {
    const d = e.target.dataset;
    switch (d.role){
      case "animal":     p.animals[Number(d.index)] = e.target.value; markDone("animals"); patchScores(); break;
      case "bonus":      p.bonus = e.target.value; markDone("bonus"); patchScores(); break;
      case "totalInput": p.totals[d.cat] = e.target.value; markDone(d.cat); patchScores(); break;
      case "countInput": setCount(p, d.path, d.key, e.target.value); markDone(d.scoreCat); patchScores(); break;
    }
  });

  // Inference runs on commit, not per keystroke — mid-typing "1" of "15" would otherwise
  // snap the category back to tally mode under the cursor.
  card.addEventListener("focusout", e => {
    const d = e.target.dataset;
    if (d.role !== "totalInput") return;
    if (inferFromTotal(p, d.cat, e.target.value)){
      delete p.totals[d.cat];
      render();
    }
  });
}

function markDone(cat){
  if (cat && !doneCats.has(cat)) doneCats.add(cat);
}

function focusTotalInput(playerId, cat){
  const el = document.querySelector(`[data-uid="p${playerId}-total-${cat}"]`);
  if (el){ el.focus(); el.select(); }
}

// Chrome for the two modes lives above the cards, so it is delegated on the container rather
// than wired per card.
document.getElementById("players").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn) return;

  switch (btn.dataset.role){
    case "pickCat":
      activeCat = btn.dataset.cat;
      render();
      break;
    case "nextCat":
      // Moving on is itself an answer — a category everyone legitimately scored 0 in still
      // deserves its tick, or the strip reads as unfinished forever.
      markDone(activeCat);
      activeCat = nextUndoneCat();
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
      break;
  }
});

document.getElementById("modeToggle").addEventListener("click", e => {

// ---- Faraway scorer ----
// Faraway has no formula-based categories like Harmonies — each card's fame is printed on the
// card itself and only counts if its prerequisite is met (checked by eye). The physical score pad
// separates Region-card fame from Sanctuary-card fame before summing, so this mirrors that as two
// repeatable number-input lists per player (same pattern as Harmonies' "Animal cards").

let faPlayers = [];
let faNextId = 1;

function newFaPlayer(name){
  return {
    id: faNextId++,
    name: name || "Player " + faNextId,
    regionFame: [0],
    sanctuaryFame: [0]
  };
}

function faTotal(p){
  return p.regionFame.reduce((sum, v) => sum + numOf(v), 0)
    + p.sanctuaryFame.reduce((sum, v) => sum + numOf(v), 0);
}

function faFameList(playerId, role, values){
  return values.map((v, i) => `
    <div class="animal-row">
      <input type="number" min="0" value="${v}" data-role="${role}" data-index="${i}" data-uid="fa-p${playerId}-${role}-${i}" />
      <span class="cat-hint" style="margin:0;">fame from this card</span>
      ${values.length > 1 ? `<button data-role="remove-${role}" data-index="${i}">✕</button>` : ''}
    </div>
  `).join("");
}

function renderFaraway(){
  const active = document.activeElement;
  let focusUid = null, selStart = null, selEnd = null;
  if (active && active.dataset && active.dataset.uid){
    focusUid = active.dataset.uid;
    if (typeof active.selectionStart === "number"){
      selStart = active.selectionStart;
      selEnd = active.selectionEnd;
    }
  }

  const container = document.getElementById("faPlayers");
  container.innerHTML = "";

  const totals = faPlayers.map(faTotal);
  const maxTotal = totals.length ? Math.max(...totals) : -1;
  const winners = totals.filter(t => t === maxTotal && maxTotal > 0).length;

  faPlayers.forEach((p, idx) => {
    const total = totals[idx];
    const isWinner = total === maxTotal && maxTotal > 0 && faPlayers.length > 1;
    const regionTotal = p.regionFame.reduce((s, v) => s + numOf(v), 0);
    const sanctuaryTotal = p.sanctuaryFame.reduce((s, v) => s + numOf(v), 0);

    const card = document.createElement("div");
    card.className = "player-card fa" + (isWinner ? " winner" : "");

    card.innerHTML = `
      <div class="player-header">
        <input type="text" value="${escapeAttr(p.name)}" data-role="fa-name" data-uid="fa-p${p.id}-name" />
        ${isWinner && winners === 1 ? '<span class="crown">👑</span>' : ''}
        <span class="total-badge">${total}</span>
        ${faPlayers.length > 1 ? '<button class="remove-player" data-role="fa-remove">✕</button>' : ''}
      </div>

      <div class="category">
        <div class="cat-label">🗺️ Region cards</div>
        <div class="cat-pts">${regionTotal}</div>
        <div class="animal-list">
          ${faFameList(p.id, "region", p.regionFame)}
          <button class="add-btn" data-role="fa-addRegion">+ Add card</button>
        </div>
        <div class="cat-hint">Reveal right to left; enter each card's fame if its prerequisite is met</div>
      </div>

      <div class="category">
        <div class="cat-label">⛩️ Sanctuaries</div>
        <div class="cat-pts">${sanctuaryTotal}</div>
        <div class="animal-list">
          ${faFameList(p.id, "sanctuary", p.sanctuaryFame)}
          <button class="add-btn" data-role="fa-addSanctuary">+ Add card</button>
        </div>
        <div class="cat-hint">Scored after all Region cards, same way</div>
      </div>
    `;

    container.appendChild(card);
    wireFaCard(card, p);
  });

  if (focusUid){
    const el = container.querySelector(`[data-uid="${focusUid}"]`);
    if (el){
      el.focus();
      if (selStart !== null && el.setSelectionRange){
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
}

function wireFaCard(card, p){
  card.querySelector('[data-role="fa-name"]').addEventListener("input", e => {
    p.name = e.target.value;
  });

  const removeBtn = card.querySelector('[data-role="fa-remove"]');
  if (removeBtn){
    removeBtn.addEventListener("click", () => {
      faPlayers = faPlayers.filter(pl => pl.id !== p.id);
      renderFaraway();
    });
  }

  [["region", "regionFame"], ["sanctuary", "sanctuaryFame"]].forEach(([role, field]) => {
    card.querySelectorAll(`[data-role="${role}"]`).forEach(input => {
      input.addEventListener("input", e => {
        const i = Number(e.target.dataset.index);
        p[field][i] = e.target.value;
        renderFaraway();
      });
    });
    card.querySelectorAll(`[data-role="remove-${role}"]`).forEach(btn => {
      btn.addEventListener("click", e => {
        const i = Number(e.target.dataset.index);
        p[field].splice(i, 1);
        renderFaraway();
      });
    });
  });

  const addRegionBtn = card.querySelector('[data-role="fa-addRegion"]');
  if (addRegionBtn){
    addRegionBtn.addEventListener("click", () => {
      p.regionFame.push(0);
      renderFaraway();
    });
  }
  const addSanctuaryBtn = card.querySelector('[data-role="fa-addSanctuary"]');
  if (addSanctuaryBtn){
    addSanctuaryBtn.addEventListener("click", () => {
      p.sanctuaryFame.push(0);
      renderFaraway();
    });
  }
}

document.getElementById("addPlayerFa").addEventListener("click", () => {
  faPlayers.push(newFaPlayer());
  renderFaraway();
});

document.getElementById("newGameFa").addEventListener("click", () => {
  if (confirm("Start a new game? This clears the current scores.")){
    faPlayers = [newFaPlayer("Player 1"), newFaPlayer("Player 2")];
    faNextId = 3;
    renderFaraway();
    hideSaveBanner("saveBannerFa");
  }
});

// ---- Views ----

function showView(name){
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + name));
  document.getElementById("footerBar").style.display = name === "scorer" ? "flex" : "none";
  document.getElementById("footerBarFaraway").style.display = name === "scorer-faraway" ? "flex" : "none";

  const logoWrap = document.getElementById("logoWrap");
  const masthead = document.getElementById("masthead");
  const showHarmoniesCritters = name !== "picker" && activeGame !== "faraway";
  document.querySelectorAll(".corner-critter").forEach(el => {
    el.style.display = showHarmoniesCritters ? "" : "none";
  });
  if (name === "picker"){
    logoWrap.classList.add("hidden");
  } else {
    logoWrap.classList.remove("hidden");
    if (activeGame === "faraway"){
      masthead.src = "assets/faraway-logo.png";
      masthead.alt = "Faraway";
    } else {
      masthead.src = "assets/logo.png";
      masthead.alt = "Harmonies";
    }
  }

  if (name === "landing") renderLandingChips();
}

function formatDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}

// ---- Landing ----

let chipsRequestId = 0;

async function fetchProfiles(){
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);
  try {
    const res = await fetch("/api/profiles?game=" + encodeURIComponent(activeGame), { signal: controller.signal });
    if (!res.ok) throw new Error("bad_status");
    const data = await res.json();
    return data.profiles || [];
  } finally {
    clearTimeout(timeout);
  }
}

async function renderLandingChips(){
  const container = document.getElementById("landingChips");
  const requestId = ++chipsRequestId;
  container.innerHTML = '<div class="chip-loading">Loading players…</div>';

  let profiles;
  try {
    profiles = await fetchProfiles();
  } catch (err) {
    if (requestId !== chipsRequestId) return;
    container.innerHTML = '<div class="chip-loading">Couldn\'t load saved players. <button class="link-btn" id="retryChips">Retry</button></div>';
    const retry = document.getElementById("retryChips");
    if (retry) retry.addEventListener("click", renderLandingChips);
    return;
  }

  if (requestId !== chipsRequestId) return;

  if (!profiles.length){
    container.innerHTML = "";
    return;
  }

  container.innerHTML = profiles.map(p => `
    <div class="chip">
      <button data-role="chip-continue" data-key="${escapeAttr(p.key)}" data-name="${escapeAttr(p.displayName)}">${escapeAttr(p.displayName)}</button>
      <span class="chip-meta">🏆 ${numOf(p.highScore)}</span>
      <button class="chip-history" data-role="chip-history" data-key="${escapeAttr(p.key)}" title="View history">📜</button>
    </div>
  `).join("");

  container.querySelectorAll('[data-role="chip-continue"]').forEach(btn => {
    btn.addEventListener("click", () => startScorerWithName(btn.dataset.name));
  });
  container.querySelectorAll('[data-role="chip-history"]').forEach(btn => {
    btn.addEventListener("click", () => openHistory(btn.dataset.key));
  });
}

function startScorerWithName(name){
  if (activeGame === "faraway"){
    faPlayers[0].name = name;
    renderFaraway();
    showView("scorer-faraway");
  } else {
    players[0].name = name;
    render();
    showView("scorer");
  }
}

const landingNameInput = document.getElementById("landingName");
const landingContinueBtn = document.getElementById("landingContinue");

landingNameInput.addEventListener("input", () => {
  landingContinueBtn.disabled = !landingNameInput.value.trim();
});
landingNameInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && landingNameInput.value.trim()){
    startScorerWithName(landingNameInput.value.trim());
  }
});
landingContinueBtn.addEventListener("click", () => {
  const name = landingNameInput.value.trim();
  if (name) startScorerWithName(name);
});
document.getElementById("landingSkip").addEventListener("click", () => {

});
document.getElementById("switchPlayer").addEventListener("click", () => showView("landing"));
document.getElementById("switchPlayerFa").addEventListener("click", () => showView("landing"));

// ---- Save this game ----

function hideSaveBanner(bannerId = "saveBanner"){
  const el = document.getElementById(bannerId);
  el.className = "save-banner";
  el.innerHTML = "";
}

function renderSaveBanner(kind, html, bannerId = "saveBanner"){
  const el = document.getElementById(bannerId);
  el.className = "save-banner visible " + kind;
  el.innerHTML = html;
}

async function submitGame(game, buildPlayers, btnId, bannerId, retryFn){
  const btn = document.getElementById(btnId);
  btn.disabled = true;
  btn.textContent = "Saving…";

  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 10000);
    let res;
    try {
      res = await fetch("/api/save-game", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ game, players: buildPlayers() }),
        signal: controller.signal
      });
    } finally {
      clearTimeout(timeout);
    }
    if (!res.ok) throw new Error("bad_status");
    const data = await res.json();

    if (data.celebrations && data.celebrations.length){
      const lines = data.celebrations.map(c =>
        `🎉 New high score for ${escapeAttr(c.displayName)} — ${c.total} (previous best ${c.previousHigh})!`
      ).join("<br>");
      renderSaveBanner("celebrate", lines, bannerId);
    } else if (data.saved && data.saved.length){
      renderSaveBanner("info", `Saved ${data.saved.length} player${data.saved.length === 1 ? "" : "s"}' game${data.saved.length === 1 ? "" : "s"}.`, bannerId);
    } else {
      renderSaveBanner("info", "No named players to save — give someone a real name first.", bannerId);
    }
  } catch (err) {
    renderSaveBanner("error", `Couldn't save — check your connection and try again. <button class="retry-btn" id="retrySave-${btnId}">Retry</button>`, bannerId);
    const retry = document.getElementById(`retrySave-${btnId}`);
    if (retry) retry.addEventListener("click", retryFn);
  } finally {
    btn.disabled = false;
    btn.textContent = "Save this game";
  }
}

function saveGame(){
  return submitGame(
    "harmonies",
    () => players.map(p => ({ name: p.name, total: totalPoints(p) })),
    "saveGame", "saveBanner", saveGame
  );
}

function saveFaraway(){
  return submitGame(
    "faraway",
    () => faPlayers.map(p => ({ name: p.name, total: faTotal(p) })),
    "saveGameFa", "saveBannerFa", saveFaraway
  );
}

document.getElementById("saveGame").addEventListener("click", saveGame);
document.getElementById("saveGameFa").addEventListener("click", saveFaraway);

// ---- History ----

let currentHistoryKey = null;
let historyRequestId = 0;

function openHistory(key){
  currentHistoryKey = key;
  showView("history");
  renderHistory(key);
}

async function renderHistory(key){
  const requestId = ++historyRequestId;
  document.getElementById("historyName").textContent = "";
  document.getElementById("historyHighScore").textContent = "";
  document.getElementById("historyList").innerHTML = '<div class="history-empty">Loading…</div>';

  let data;
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 10000);
    let res;
    try {
      res = await fetch("/api/profile?name=" + encodeURIComponent(key) + "&game=" + encodeURIComponent(activeGame), { signal: controller.signal });
    } finally {
      clearTimeout(timeout);
    }
    if (res.status === 404){
      if (requestId !== historyRequestId) return;
      document.getElementById("historyList").innerHTML = '<div class="history-empty">No history yet.</div>';
      return;
    }
    if (!res.ok) throw new Error("bad_status");
    data = await res.json();
  } catch (err) {
    if (requestId !== historyRequestId) return;
    document.getElementById("historyList").innerHTML = '<div class="history-empty">Couldn\'t load history. <button class="link-btn" id="retryHistory">Retry</button></div>';
    const retry = document.getElementById("retryHistory");
    if (retry) retry.addEventListener("click", () => renderHistory(key));
    return;
  }

  if (requestId !== historyRequestId) return;

  document.getElementById("historyName").textContent = data.displayName;
  document.getElementById("historyHighScore").textContent = "🏆 High score: " + data.highScore;
  document.getElementById("historyList").innerHTML = data.games.map(g => `
    <div class="history-row${g.total === data.highScore ? " is-best" : ""}">
      <span>${formatDate(g.playedAt)}</span><span>${g.total}</span>
    </div>
  `).join("") || '<div class="history-empty">No games yet.</div>';
}

document.getElementById("historyBack").addEventListener("click", () => showView("landing"));

// ---- Leaderboard ----

let leaderboardRequestId = 0;

async function renderLeaderboard(){
  const requestId = ++leaderboardRequestId;
  const list = document.getElementById("leaderboardList");
  list.innerHTML = '<div class="history-empty">Loading…</div>';

  let data;
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 10000);
    let res;
    try {
      res = await fetch("/api/leaderboard?game=" + encodeURIComponent(activeGame), { signal: controller.signal });
    } finally {
      clearTimeout(timeout);
    }
    if (!res.ok) throw new Error("bad_status");
    data = await res.json();
  } catch (err) {
    if (requestId !== leaderboardRequestId) return;
    list.innerHTML = '<div class="history-empty">Couldn\'t load leaderboard. <button class="link-btn" id="retryLeaderboard">Retry</button></div>';
    const retry = document.getElementById("retryLeaderboard");
    if (retry) retry.addEventListener("click", renderLeaderboard);
    return;
  }

  if (requestId !== leaderboardRequestId) return;

  const rows = data.leaderboard || [];
  list.innerHTML = rows.map((p, i) => `
    <div class="history-row${i < 3 ? " top-3" : ""}">
      <span class="rank">#${i + 1}</span>
      <span class="name">${escapeAttr(p.displayName)}</span>
      <span>${p.highScore}</span>
    </div>
  `).join("") || '<div class="history-empty">No games saved yet.</div>';
}

document.getElementById("landingLeaderboard").addEventListener("click", () => {
  showView("leaderboard");
  renderLeaderboard();
});
document.getElementById("scorerLeaderboard").addEventListener("click", () => {
  showView("leaderboard");
  renderLeaderboard();
});

  renderLeaderboard();
});
document.getElementById("leaderboardBack").addEventListener("click", () => showView("landing"));

players = [newPlayer("Player 1"), newPlayer("Player 2")];
